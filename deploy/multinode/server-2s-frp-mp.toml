# server-2s-frp-mp.toml —— scenario 2 [two servers · cross-machine Raft + dual
# transport] server-2 (jowency LXD flock-s2).
#
# Frp relay access (the optional adapter form of §2.1): frps runs on the jowency
# host :7000/:24000; this server's in-process flock-frpc Supervisor (the
# Original-stack stand-in) registers 9443 → the user port 24000; LXD-side
# clients access via jowency LAN IP:24000. The Raft fabric :9500 is published
# to jowency 0.0.0.0:9500 via an LXD proxy device, forming the cross-machine
# cluster with the Windows Docker side's server-1.
#
# Template variables: @JOW_LAN_IP@ / @LXD_GW_IP@ (rendered by lxd-setup.sh;
# LXD_GW = the lxdbr0 host IP).

state_dir = "/var/lib/flock"
mode = "frp"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "@JOW_LAN_IP@:24000"
extra_endpoints = []
dir_version = 1

ticket_ttl_secs = 60

tun_name = "tun0"
vip = "100.64.0.2"

[frp]
frpc_bin = "/usr/local/bin/frpc"
original_toml = """
serverAddr = "@LXD_GW_IP@"
serverPort = 7000

[[proxies]]
name = "flock-s2-main"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9443
remotePort = 24000
"""

[sync]
mode = "raft"
bundle = "/var/lib/flock/bundle.bin"
raft_bind = "0.0.0.0:9500"
raft_peers = [
    "1=@WIN_LAN_IP@:9500",
    "2=@JOW_LAN_IP@:9500",
]
