# server-2w-direct-mp.toml —— scenario 2 [two servers · cross-machine Raft]
# server-1 (Windows Docker).
#
# Direct access + the multi-primary build tier: publishes 0.0.0.0:9443 (the
# clients' main endpoint) and 0.0.0.0:9500 (the Raft fabric) to the Windows
# host. raft_peers crosses the real network:
#   node 1 = the Windows host (this machine, pulled in via Docker NAT)
#   node 2 = the jowency host (the LXD proxy device publishing flock-s2:9500)
# Both servers' raft_peers tables are identical (the §6.2 TcpFabric dial
# table).
#
# Template variables: @WIN_LAN_IP@ / @JOW_LAN_IP@ (rendered by
# win-docker-setup.sh).

state_dir = "/var/lib/flock"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "@WIN_LAN_IP@:9443"
extra_endpoints = []
dir_version = 1

ticket_ttl_secs = 60

tun_name = "tun0"
vip = "100.64.0.1"

[sync]
mode = "raft"
bundle = "/var/lib/flock/bundle.bin"
raft_bind = "0.0.0.0:9500"
raft_peers = [
    "1=@WIN_LAN_IP@:9500",
    "2=@JOW_LAN_IP@:9500",
]
