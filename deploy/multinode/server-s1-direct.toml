# server-s1-direct.toml —— the flock-s1 config for scenario 1 [single server ·
# Direct] (jowency LXD).
#
# Form (docs/design.md §2.1): Direct listens by default, zero frp logic; no
# [sync] section = single-server state store. The access endpoint is published
# to the jowency host 0.0.0.0:9443 via an LXD proxy device; the clients
# (Windows Docker ×2 + LXD ×2) connect cross-machine directly, the WIN side to
# jowency LAN IP:9443.
#
# Template variables: @JOW_LAN_IP@ = the jowency host LAN IP (rendered by
# lxd-setup.sh).

state_dir = "/var/lib/flock"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "@JOW_LAN_IP@:9443"
extra_endpoints = []
dir_version = 1

ticket_ttl_secs = 60

# Data plane: the server itself is also a peer (VIP 100.64.0.1, §2.2).
tun_name = "tun0"
vip = "100.64.0.1"
