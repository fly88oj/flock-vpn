# frps-mn.toml —— scenario 2's frps (a jowency host process, stock frp v0.71.1).
#
# Serves only flock-s2 (LXD, the access endpoint when no LAN-direct publication
# is needed): bind 7000 (the frpc registration port) + the user port 24000
# registered by flock-s2's in-process frpc (remotePort). Running bare on the
# LAN (ufw already allows inbound from 192.168.0.0/16; short test lifetime, no
# token —— at your own risk when replicating).

bindPort = 7000
