# m3.yml —— M3 client data plane (docs/design.md §7-M3: the m2 topology + a client container).
#
#   docker compose -f deploy/m3.yml up -d --build
#   bash deploy/m3_assert.sh          # single-server versions of A2/A3/A4/A9
#
# Topology (the frp-relay variant of m2.yml plus a real client; network m3net =
# "the simulated untrusted public network"):
#   frps (stock v0.71.1; user ports 27500/27501 reachable inside the container
#     network; the host 127.0.0.1 mapped ports serve the Windows real-machine
#     manual checklist —— §7-M3/§7-M5 host `--smoke`/run connecting to the local
#     relay)
#     └─ server (Frp mode + M3 data plane: tun0 VIP 100.64.0.1; --cap-add
#                NET_ADMIN --device /dev/net/tun, the WSL2-backend tun passthrough
#                proven in §6.1)
#   client (flock-client; tun0 VIP = the device-add assignment; same
#           NET_ADMIN/tun passthrough)
#
# The stock frp binaries are pulled from .tmp/frp_0.71.1_linux_amd64/ via the
# named build context (same as m2.yml).
# The orchestration (gen-keys → device-add → invite → vip → ready → restart) is
# driven by m3_assert.sh.

name: flock-m3

services:
  frps:
    build:
      context: build            # only Dockerfile.frps + frps.toml (committed)
      dockerfile: Dockerfile.frps
      additional_contexts:
        bins: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/frps:0.71.1
    # Host mapping (loopback only): the Windows real-machine checklist
    # (§7-M3/§7-M5) host client connects to the local relay via
    # 127.0.0.1:27500/27501; the in-network ports are unaffected.
    ports:
      - "127.0.0.1:27500:27500"
      - "127.0.0.1:27501:27501"
    networks: [m3net]
    restart: unless-stopped

  server:
    build:
      context: ..               # workspace root (sources; .dockerignore trims target/.tmp)
      dockerfile: deploy/Dockerfile.server
      additional_contexts:
        frpbin: ../.tmp/frp_0.71.1_linux_amd64
      args:
        server_conf: server-m3.toml   # container-network-view endpoints (frps:27500/27501)
    image: flock/server:m3
    depends_on: [frps]
    # M3 data plane: the server itself is also a peer (tun + routes, §2.2).
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    # rp_filter=1 (§2.3, innernet recommendation): an unprivileged container has
    # a read-only /proc/sys —— the namespaced sysctls are set at runtime
    # (default ⇒ a newly created tun0 inherits 1; the in-code /proc write falls
    # back to the host path).
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [m3net]
    volumes:
      - server-state:/var/lib/flock
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: flock/client:m3
    depends_on: [server]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [m3net]
    volumes:
      - client-state:/var/lib/flock
    restart: unless-stopped

networks:
  m3net:
    name: flock-m3net

volumes:
  server-state: {}
  client-state: {}
