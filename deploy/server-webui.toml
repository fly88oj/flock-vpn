# server-webui.toml —— the server config of the M8 Web UI assertion topology
# (embedded in deploy/webui.yml).
#
# Direct mode (isomorphic to server-direct.toml) + an explicit [webui] section
# (§7-M8.2: dual bind 127.0.0.1:9800 + tun VIP 100.64.0.1:9800 —— no LAN/public
# bind ⇒ W5's connection-layer unreachability).
# advertise_endpoint uses the compose service name (127.0.0.1 is unreachable
# from the client-1 container —— W4's VPN-segment login chain needs the client
# to dial in via the directory endpoint; the directory is a root-signed product
# and takes precedence over the client config override).

state_dir = "/var/lib/flock"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "server-a:9443"
extra_endpoints = []
dir_version = 1

ticket_ttl_secs = 60
peer_retention_days = 30
max_sessions = 1024

tun_name = "tun0"
vip = "100.64.0.1"

[webui]
enabled = true
port = 9800
session_ttl_secs = 28800
series_points = 120
series_interval_secs = 60
