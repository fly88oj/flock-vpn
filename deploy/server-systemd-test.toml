# server.toml —— Direct mode (the server container of deploy/systemd-test.yml; M6 systemd field test).
#
# Differences from server-direct.toml (the m2-direct single-container host form):
#   - advertise_endpoint = "server:9443" (**container-network view** —— the
#     systemd client shares the compose network, so the directory-issued
#     endpoint resolves directly for the client; the m2-direct client sits on
#     the host ⇒ the 127.0.0.1 mapped ports);
#   - tun_name takes effect (M3 data plane: the server itself is also a peer,
#     VIP 100.64.0.1 —— the S3 ping face).
# The rest of the config face is isomorphic to m2-direct (zero frp assets, no
# prepare needed). Mounting is described in systemd-test.yml (a bind mount
# overrides the in-image /etc/flock/server.toml, leaving
# Dockerfile.server-direct untouched).

state_dir = "/var/lib/flock"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "server:9443"
dir_version = 1

# M3 data-plane interface name (the server tun; VIP fixed at 100.64.0.1 ——
# netstate assignments start at .2).
tun_name = "tun0"
