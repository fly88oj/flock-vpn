# server.toml —— Frp mode (the server container in m3.yml; docs/design.md §7-M3).
#
# The only difference from server-frp.toml (M2): the advertise/extra endpoints
# are in the **container-network view** (frps:27500 / frps:27501 —— the M3
# client shares the network with frps; the M2 client sits on the host ⇒ the
# 127.0.0.1 mapped ports).
# Data plane (M3): tun_name takes effect —— the server itself is also a peer
# (VIP 100.64.0.1, §2.2).

state_dir = "/var/lib/flock"
mode = "frp"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "frps:27500"
extra_endpoints = ["frps:27501"]
dir_version = 1

# Ticket TTL: default 60 (§2.2 hard cap); deployments lower it so the expiry
# path can be accepted without waiting (M2 semantics carried over).
ticket_ttl_secs = 6

# M3 data-plane interface name (the server tun; VIP fixed at 100.64.0.1 ——
# netstate assignments start at .2).
tun_name = "tun0"

[frp]
frpc_bin = "/usr/local/bin/frpc"
# Embedded registration with the stock frpc TOML (v0.71.1 dialect): two tcp
# proxies = main endpoint + second exposure.
original_toml = """
serverAddr = "frps"
serverPort = 7000

[[proxies]]
name = "flock-main"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9443
remotePort = 27500

[[proxies]]
name = "flock-alt"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9443
remotePort = 27501
"""
