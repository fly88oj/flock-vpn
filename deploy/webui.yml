# webui.yml —— M8 Web UI container integration (the topology carrying
# docs/design.md §7-M8.9 W1–W7).
#
#   Single-server topology (W1–W5/W7):
#     docker compose -f deploy/webui.yml up -d --build
#     bash deploy/webui_assert.sh
#   Dual-server Raft topology (W6; isolated by an independent project name ——
#   runs in parallel with the single-server topology without port/volume/
#   network clashes):
#     docker compose -p flock-webui-dual -f deploy/webui.yml --profile dual up -d --build
#     bash deploy/webui_assert.sh          # W6 runs once it detects dual-b up
#
# Topology:
#   server-a (Dockerfile.webui default tier: single-server Direct; flock-server
#     + the webui_login driver + curl/jq; Direct 9443 + admin 9444 + webui dual
#     bind 127.0.0.1:9800/tun VIP:9800; cap NET_ADMIN + /dev/net/tun —— the VIP
#     face is bound once tun is ready)
#   client-1 (flock-client image + curl; the W4 VPN-segment login-chain vehicle /
#     the W5 connection-layer unreachability probe —— bash /dev/tcp fallback)
#   dual-a / dual-b (profile "dual": multi-primary build tier +
#     server-webui-{a,b}.toml two-voter Raft, VIP 100.64.0.1/.2; enroll bundles
#     and cluster-bootstrap are driven idempotently by webui_assert.sh W6)
#   dual-client (profile "dual": flock-client, onboarded via cluster-invite ——
#     W6 reaches both VIPs simultaneously from the VPN segment)
#   operator (profile "dual": one-shot init-cluster --voters 2 → /mat volume)
#
# Single network flockpub: the server's container-network address (e.g.
# 172.x.y.z) is **not bound on 9800** —— webui binds loopback + tun VIP only ⇒
# W5's probe from client-1 to server-a:9800 (the flockpub address) is refused.

name: flock-webui

services:
  server-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.webui
    image: flock/server:webui
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [flockpub]
    volumes:
      - server-a-state:/var/lib/flock
    restart: unless-stopped

  client-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: flock/client:webui
    depends_on: [server-a]
    hostname: client-1
    command: ["--config", "/var/lib/flock/client.toml", "service"]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [flockpub]
    volumes:
      - client-1-state:/var/lib/flock
    restart: unless-stopped

  # —— dual tier (W6): two-voter Raft ——
  # Note: a/b build tiers differ (server-webui-{a,b}.toml) ⇒ **the image tags
  # must be separate** —— a same-tag double build has the latter overwrite the
  # former (b's config ending up in a's container).
  dual-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.webui
      args:
        server_features: multi-primary
        server_conf: server-webui-a.toml
    image: flock/server:webui-mp-a
    profiles: [dual]
    hostname: dual-a
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [flockpub]
    volumes:
      - dual-a-state:/var/lib/flock
      - cluster-mat:/mat:ro
    restart: unless-stopped

  dual-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.webui
      args:
        server_features: multi-primary
        server_conf: server-webui-b.toml
    image: flock/server:webui-mp-b
    profiles: [dual]
    hostname: dual-b
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [flockpub]
    volumes:
      - dual-b-state:/var/lib/flock
      - cluster-mat:/mat:ro
    restart: unless-stopped

  dual-client:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: flock/client:webui
    profiles: [dual]
    depends_on: [dual-a, dual-b]
    hostname: dual-client
    command: ["--config", "/var/lib/flock/client.toml", "service"]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [flockpub]
    volumes:
      - dual-client-state:/var/lib/flock
    restart: unless-stopped

  # —— dual tier: one-shot ops container (init-cluster --voters 2, idempotent) ——
  operator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.webui
      args:
        server_features: multi-primary
        server_conf: server-webui-a.toml
    image: flock/server:webui-mp-a
    profiles: [dual]
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /mat/root.seed ]; then
          echo "operator: cluster material already present (skip init-cluster)"
        else
          flock-server --config /etc/flock/server.toml init-cluster \
            --voters 2 --out /mat \
            --endpoints "dual-a:9443,dual-b:9443"
        fi
    volumes:
      - cluster-mat:/mat
    networks: [flockpub]
    restart: "no"

networks:
  flockpub:

volumes:
  server-a-state:
  client-1-state:
  dual-a-state:
  dual-b-state:
  dual-client-state:
  cluster-mat:
