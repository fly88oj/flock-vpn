# server.toml —— Frp mode (the server container in m2.yml; docs/design.md §2.1/§3.11/§7-M2).
#
# The single access endpoint = the frps user ports (host 127.0.0.1:27500/27501
# mappings); the local listener on 9443 never leaves the container.
# advertise/extra = the endpoints from the client's (host smoke test) view;
# extra is the "second exposure" —— the same server exposed via a second proxy
# through frps, for the §7-M2 "still 1-RTT after an endpoint change" simulation.

state_dir = "/var/lib/flock"
mode = "frp"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "127.0.0.1:27500"
extra_endpoints = ["127.0.0.1:27501"]
dir_version = 1

# Ticket TTL: default 60 (§2.2 hard cap); smoke deployments lower it so the
# "expired ticket" assertion need not wait 60s.
ticket_ttl_secs = 6

[frp]
frpc_bin = "/usr/local/bin/frpc"
# Embedded registration with the stock frpc TOML (v0.71.1 dialect): two tcp
# proxies = main endpoint + second exposure.
original_toml = """
serverAddr = "frps"
serverPort = 7000

[[proxies]]
name = "flock-main"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9443
remotePort = 27500

[[proxies]]
name = "flock-alt"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9443
remotePort = 27501
"""
