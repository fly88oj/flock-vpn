# server.toml —— Frp 模式（m2.yml 内的 server 容器；docs/design.md §2.1/§3.11/§7-M2）。
#
# 单一接入端点 = frps 用户口（宿主 127.0.0.1:27500/27501 映射）；本地监听 9443 不出容器。
# advertise/extra = 客户端（宿主冒烟测试）视角的端点；extra 即「第二暴露口」——同一服务器
# 经 frps 的第二个 proxy 暴露，用于 §7-M2「换端点仍 1-RTT」模拟。

state_dir = "/var/lib/chmlvpn"
mode = "frp"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "127.0.0.1:27500"
extra_endpoints = ["127.0.0.1:27501"]
dir_version = 1

# 票据 TTL：缺省 60（§2.2 硬顶）；冒烟部署调小以便「过期票据」断言不必等 60s。
ticket_ttl_secs = 6

[frp]
frpc_bin = "/usr/local/bin/frpc"
# 原版 frpc TOML（v0.71.1 方言）内嵌注册：两条 tcp proxy = 主端点 + 第二暴露口。
original_toml = """
serverAddr = "frps"
serverPort = 7000

[[proxies]]
name = "chml-main"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9443
remotePort = 27500

[[proxies]]
name = "chml-alt"
type = "tcp"
localIP = "127.0.0.1"
localPort = 9443
remotePort = 27501
"""
