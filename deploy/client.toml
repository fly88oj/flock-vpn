# client.toml —— default configuration for the flock-client image (docs/design.md §3.12/§7-M3).
#
# The identity triple (device.keys/pins.bin/directory.bin) and the vip are
# written into state_dir by the deployment orchestration
# (deploy/m3_assert.sh: gen-keys → server-side device-add → invite → vip).

state_dir = "/var/lib/flock"

# This side's VIP: empty = read the state_dir/vip file (the orchestration
# writes the device-add assigned value).
# vip = "100.64.0.11"

tun_name = "tun0"
mtu = 1280

# Endpoint override (debugging/assertion pinning); default = rotate over all
# endpoints from the root-signed directory (§2.3 endpoint rotation switching).
# endpoints = ["frps:27500", "frps:27501"]
