# frpc-a —— the relay registration of server-a (docs/design.md §6.2 M5).
# proxy flock-a-main: server-a:9443 → frps-a user port 23000 (the flock access
# endpoint).
# proxy flock-a-echo: echo-a:9001 → frps-a 23100 (the A1 byte-passthrough
# harness's echo face over the same relay link —— replicated by R1/R2).
serverAddr = "frps-a"
serverPort = 7000

[[proxies]]
name = "flock-a-main"
type = "tcp"
localIP = "server-a"
localPort = 9443
remotePort = 23000

[[proxies]]
name = "flock-a-echo"
type = "tcp"
localIP = "echo-a"
localPort = 9001
remotePort = 23100
