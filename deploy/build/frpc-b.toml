# frpc-b —— the relay registration of server-b (docs/design.md §6.2 M5).
# User port 23001 (server-b access endpoint) + echo 23101 (A1's second relay).
serverAddr = "frps-b"
serverPort = 7000

[[proxies]]
name = "flock-b-main"
type = "tcp"
localIP = "server-b"
localPort = 9443
remotePort = 23001

[[proxies]]
name = "flock-b-echo"
type = "tcp"
localIP = "echo-b"
localPort = 9001
remotePort = 23101
