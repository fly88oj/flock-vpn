# e2e.yml —— M5 full topology (docs/design.md §6.2/§6.3: three isolated networks + Direct/Frp mix + 3 voters).
#
#   docker compose -f deploy/e2e.yml up -d --build
#   bash deploy/e2e_assert.sh          # A1–A16 (§6.3)
#
# Three isolated networks (§6.2: a single subnet would make "simulating an
# untrusted public network" a misnomer):
#   flockpub 172.28.0.0/24  bridge —— the simulated untrusted public network:
#                            frps-a/b, the frpc-a/b sidecars, client-1/2/3, and
#                            the Direct-form server-c (172.28.0.22); ciphertext
#                            flows through it. 172.28.0.20/.21 are **deliberately
#                            unassigned** —— the "server-a/b direct connection
#                            unreachable" target addresses of A13.
#   srvmesh 172.29.0.0/24  internal —— only the three servers attach (Raft/gossip/
#                            FRWD interconnect never leaves for the public network;
#                            network aliases raft-1/2/3 = the TcpFabric dial table).
#   link-a/b each /30        frpc sidecar ↔ its server (the sidecar exposes
#                            server:9443 through the relay).
#
# Orchestration (driven by e2e_assert.sh, idempotent):
#   at up time the operator (one-shot) runs init-cluster --voters 3 --endpoints …
#   (skipped if root.seed already exists) → three enrolls (bundles from the /mat
#   volume) → server-side cluster-bootstrap (root-signed Bootstrap+SetOprf)
#   → device-add/cluster-invite → client gen-keys/invite/vip/ready → restart client.
# The server containers **wait** until the bundle/cluster are ready (the
# sync.rs wait semantics); `up -d` starts everything at once without crash loops.

name: flock-e2e

x-e2e-server: &e2e-server
  build:
    context: ..
    dockerfile: deploy/Dockerfile.server
    additional_contexts:
      frpbin: ../.tmp/frp_0.71.1_linux_amd64
    args:
      server_features: multi-primary   # §6.2 M5: NetBackend::Sync/Raft assembly tier
  cap_add: [NET_ADMIN]
  devices:
    - /dev/net/tun:/dev/net/tun
  sysctls:
    net.ipv4.conf.all.rp_filter: "1"
    net.ipv4.conf.default.rp_filter: "1"
  volumes:
    - cluster-mat:/mat:ro              # init-cluster products (enroll inputs; root.seed stays on the ops side)
  restart: unless-stopped

services:
  # —— relays (stock frps v0.71.1 pinned; user ports 23000/23100, 23001/23101 registered by the frpc proxies) ——
  frps-a:
    build:
      context: build
      dockerfile: Dockerfile.frps
      additional_contexts:
        bins: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/frps:0.71.1
    networks:
      flockpub:
        ipv4_address: 172.28.0.2
    restart: unless-stopped

  frps-b:
    build:
      context: build
      dockerfile: Dockerfile.frps
      additional_contexts:
        bins: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/frps:0.71.1
    networks:
      flockpub:
        ipv4_address: 172.28.0.3
    restart: unless-stopped

  # —— frpc sidecars (relay registration of server-a/b; the A1 echo face rides the same links) ——
  frpc-a:
    build:
      context: build
      dockerfile: Dockerfile.frpc
      additional_contexts:
        bins: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/frpc:0.71.1
    command: ["-c", "/etc/frpc/frpc.toml"]
    volumes:
      - ./build/frpc-a.toml:/etc/frpc/frpc.toml:ro
    depends_on: [frps-a]
    networks:
      flockpub:
        ipv4_address: 172.28.0.4
      link-a: {}
    restart: unless-stopped

  frpc-b:
    build:
      context: build
      dockerfile: Dockerfile.frpc
      additional_contexts:
        bins: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/frpc:0.71.1
    command: ["-c", "/etc/frpc/frpc.toml"]
    volumes:
      - ./build/frpc-b.toml:/etc/frpc/frpc.toml:ro
    depends_on: [frps-b]
    networks:
      flockpub:
        ipv4_address: 172.28.0.5
      link-b: {}
    restart: unless-stopped

  # —— A1 byte-passthrough echo endpoints (inside the link networks; exposed through the relays as 23100/23101) ——
  echo-a:
    build:
      context: build
      dockerfile: Dockerfile.echo
    image: flock/echo:e2e
    networks: [link-a]
    restart: unless-stopped

  echo-b:
    build:
      context: build
      dockerfile: Dockerfile.echo
    image: flock/echo:e2e
    networks: [link-b]
    restart: unless-stopped

  # —— three servers (3-voter quorum, §4; Direct/Frp mix, §6.2) ——
  server-a:
    <<: *e2e-server
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      additional_contexts:
        frpbin: ../.tmp/frp_0.71.1_linux_amd64
      args:
        server_features: multi-primary
        server_conf: server-e2e-a.toml
    image: flock/server:e2e-a
    depends_on: [frpc-a]
    volumes:
      - cluster-mat:/mat:ro
      - server-a-state:/var/lib/flock
    networks:
      link-a: {}
      srvmesh:
        aliases: [raft-1]

  server-b:
    <<: *e2e-server
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      additional_contexts:
        frpbin: ../.tmp/frp_0.71.1_linux_amd64
      args:
        server_features: multi-primary
        server_conf: server-e2e-b.toml
    image: flock/server:e2e-b
    depends_on: [frpc-b]
    volumes:
      - cluster-mat:/mat:ro
      - server-b-state:/var/lib/flock
    networks:
      link-b: {}
      srvmesh:
        aliases: [raft-2]

  server-c:
    # Direct form (the hard-constraint gatekeeping template, §0/§2.1): directly
    # on flockpub, no frpc sidecar, no frp process (A16's pgrep face); the
    # image shares the a/b source (a build without an [frp] section assembles
    # zero frp).
    <<: *e2e-server
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      additional_contexts:
        frpbin: ../.tmp/frp_0.71.1_linux_amd64
      args:
        server_features: multi-primary
        server_conf: server-e2e-c.toml
    image: flock/server:e2e-c
    volumes:
      - cluster-mat:/mat:ro
      - server-c-state:/var/lib/flock
    networks:
      flockpub:
        ipv4_address: 172.28.0.22
      srvmesh:
        aliases: [raft-3]

  # —— one-shot ops container: init-cluster (idempotent —— skipped if root.seed already present) ——
  operator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
      additional_contexts:
        frpbin: ../.tmp/frp_0.71.1_linux_amd64
      args:
        server_features: multi-primary
        server_conf: server-e2e-a.toml
    image: flock/server:e2e-a
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -f /mat/root.seed ]; then
          echo "operator: cluster material already present (skip init-cluster)"
        else
          flock-server --config /etc/flock/server.toml init-cluster \
            --voters 3 --out /mat \
            --endpoints "frps-a:23000,frps-b:23001,172.28.0.22:9443"
        fi
    volumes:
      - cluster-mat:/mat
    networks:
      flockpub:
        ipv4_address: 172.28.0.6
    restart: "no"

  # —— clients ×3 (pinned access mapping, §6.2: client-1→frps-a, client-2→frps-b, client-3→direct) ——
  client-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: flock/client:e2e
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    volumes:
      - ./client-e2e-1.toml:/etc/flock/client.toml:ro
      - client-1-state:/var/lib/flock
    networks:
      flockpub:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  client-2:
    image: flock/client:e2e
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    volumes:
      - ./client-e2e-2.toml:/etc/flock/client.toml   # rw: the A15 migration rewrites the endpoint order inside the container
      - client-2-state:/var/lib/flock
    networks:
      flockpub:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

  client-3:
    image: flock/client:e2e
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    volumes:
      - ./client-e2e-3.toml:/etc/flock/client.toml:ro
      - client-3-state:/var/lib/flock
    networks:
      flockpub:
        ipv4_address: 172.28.0.12
    restart: unless-stopped

networks:
  flockpub:
    name: flock-e2e-flockpub
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
  srvmesh:
    name: flock-e2e-srvmesh
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  link-a:
    # Design §6.2 says /30; a Docker bridge needs one address each for the
    # gateway and broadcast, leaving only 2 usable in a /30 —— not enough for
    # the "gateway + sidecar + server" triple —— so the smallest usable /29
    # (isolation semantics unchanged).
    name: flock-e2e-link-a
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/29
  link-b:
    name: flock-e2e-link-b
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.8/29

volumes:
  cluster-mat: {}
  server-a-state: {}
  server-b-state: {}
  server-c-state: {}
  client-1-state: {}
  client-2-state: {}
  client-3-state: {}
