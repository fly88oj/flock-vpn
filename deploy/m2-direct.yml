# m2-direct.yml —— M2 direct-connection path (docs/design.md §7-M2 "direct smoke
# variant", §2.1 hard-constraint gatekeeping).
#
#   docker compose -f deploy/m2-direct.yml up -d --build     # no prepare needed (zero frp assets)
#   cargo test -p flock-server --test smoke -- --ignored direct
#
# Only a server container: no frps container, no frpc process, no frp binaries
# in the image (Dockerfile.server-direct). Host direct-connection mapped ports:
# 9443 main endpoint + 9444→9443 second exposure.

name: flock-m2-direct

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server-direct
    image: flock/server:m2-direct
    # Host direct-connection mapped ports (loopback only, aligned with the
    # m3.yml pattern —— host smoke goes through 127.0.0.1):
    # 9443 main endpoint + 9444→9443 second exposure = a second host mapping of
    # the same container port (endpoint-change simulation, §7-M2)
    ports:
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:9444:9443"
    volumes:
      - server-state:/var/lib/flock
    restart: unless-stopped

volumes:
  server-state: {}
