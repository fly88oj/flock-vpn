# server.toml —— e2e server-c (docs/design.md §6.2 M5: **Direct access form** + multi-primary voter 3).
#
# Hard-constraint gatekeeping template (§0/§2.1): Direct = listening directly
# on the flockpub address (172.28.0.22:9443) —— zero frp logic (no frpc sidecar,
# no frp process, A16's pgrep face); the same ServerEntry material system
# interoperates with the Frp form (clients notice no difference). tun VIP
# 100.64.0.3 (§6.2).

state_dir = "/var/lib/flock"
mode = "direct"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "172.28.0.22:9443"
extra_endpoints = []
dir_version = 1

ticket_ttl_secs = 60

tun_name = "tun0"
vip = "100.64.0.3"

[sync]
mode = "raft"
bundle = "/var/lib/flock/bundle.bin"
raft_bind = "0.0.0.0:9500"
raft_peers = [
    "1=raft-1:9500",
    "2=raft-2:9500",
    "3=raft-3:9500",
]
