# server.toml —— e2e server-c（docs/design.md §6.2 M5：**Direct 接入形态** + 多主 voter 3）。
#
# 硬约束守门样板（§0/§2.1）：Direct = 直接监听 flockpub 地址（172.28.0.22:9443）——
# 零 frp 逻辑（无 frpc 边车、无 frp 进程，A16 的 pgrep 面）；同一 ServerEntry 材料体系
# 与 Frp 形态互通（客户端无感知差异）。tun VIP 100.64.0.3（§6.2）。

state_dir = "/var/lib/flock"
mode = "direct"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "172.28.0.22:9443"
extra_endpoints = []
dir_version = 1

ticket_ttl_secs = 60

tun_name = "tun0"
vip = "100.64.0.3"

[sync]
mode = "raft"
bundle = "/var/lib/flock/bundle.bin"
raft_bind = "0.0.0.0:9500"
raft_peers = [
    "1=raft-1:9500",
    "2=raft-2:9500",
    "3=raft-3:9500",
]
