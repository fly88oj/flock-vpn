# m2.yml —— M2 frp 中转路径（docs/design.md §7-M2 完成标准第一项）。
#
#   docker compose -f deploy/m2.yml up -d --build
#   cargo test -p flock-server --test smoke -- --ignored relay
#
# 原版 frp v0.71.1 二进制（frps/frpc）经**命名构建上下文**直取
# `.tmp/frp_0.71.1_linux_amd64/`（build.additional_contexts）——`up -d --build` 免任何
# 拷贝前置步骤，各镜像主 context 保持小（frps = deploy/build、server = 仓库根）。
# 若 .tmp 无该目录（新机器）：下载 v0.71.1 Linux amd64 包解压到 .tmp/ 即可
# （frp-compat §1：GitHub Releases v0.71.1 / 2026-10-14）。
#
# 拓扑（隔离网络 frpnet = 「模拟不可信公网」，§6.2 同思路）：
#   frps（原版 v0.71.1，用户口 27500/27501 映射宿主）
#     └─ server（Frp 模式：内嵌 frpc 双 proxy 注册 → 本地 9443；admin 仅容器 loopback）
#   client-skeleton（M3 骨架占位：宿主冒烟测试承担 M2 的客户端角色）

name: flock-m2

services:
  frps:
    build:
      context: build            # 仅 Dockerfile.frps + frps.toml（committed）
      dockerfile: Dockerfile.frps
      additional_contexts:
        bins: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/frps:0.71.1
    # 用户口映射宿主（客户端拨号目标；advertise_endpoint 与之对应）
    ports:
      - "27500:27500"
      - "27501:27501"
    networks: [frpnet]
    restart: unless-stopped

  server:
    build:
      context: ..               # workspace 根（源码；.dockerignore 裁剪 target/.tmp 等）
      dockerfile: deploy/Dockerfile.server
      additional_contexts:
        frpbin: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/server:m2
    depends_on: [frps]
    networks: [frpnet]
    volumes:
      - server-state:/var/lib/flock
    restart: unless-stopped

  # M3 客户端骨架占位（§7-M2「1 client 骨架」）；M2 的客户端断言由宿主冒烟测试执行。
  client-skeleton:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on: [server]
    networks: [frpnet]

networks:
  frpnet: {}

volumes:
  server-state: {}
