# m2.yml —— M2 frp relay path (docs/design.md §7-M2 completion criteria, item one).
#
#   docker compose -f deploy/m2.yml up -d --build
#   cargo test -p flock-server --test smoke -- --ignored relay
#
# The stock frp v0.71.1 binaries (frps/frpc) are pulled straight from
# `.tmp/frp_0.71.1_linux_amd64/` via a **named build context**
# (build.additional_contexts) —— `up -d --build` needs no copy pre-step and each
# image's main context stays small (frps = deploy/build, server = repo root).
# If .tmp lacks that directory (a new machine): download the v0.71.1 Linux
# amd64 package and unpack it into .tmp/
# (frp-compat §1: GitHub Releases v0.71.1 / 2026-10-14).
#
# Topology (isolated network frpnet = "the simulated untrusted public network",
# same idea as §6.2):
#   frps (stock v0.71.1, user ports 27500/27501 mapped to the host)
#     └─ server (Frp mode: embedded frpc dual-proxy registration → local 9443;
#                admin on container loopback only)
#   client-skeleton (M3 skeleton placeholder: host smoke tests play M2's client role)

name: flock-m2

services:
  frps:
    build:
      context: build            # only Dockerfile.frps + frps.toml (committed)
      dockerfile: Dockerfile.frps
      additional_contexts:
        bins: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/frps:0.71.1
    # User ports mapped to the host (loopback only, aligned with the m3.yml
    # pattern: host smoke / client dial targets go through 127.0.0.1, the
    # in-network ports are unaffected; advertise_endpoint matches)
    ports:
      - "127.0.0.1:27500:27500"
      - "127.0.0.1:27501:27501"
    networks: [frpnet]
    restart: unless-stopped

  server:
    build:
      context: ..               # workspace root (sources; .dockerignore trims target/.tmp etc.)
      dockerfile: deploy/Dockerfile.server
      additional_contexts:
        frpbin: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/server:m2
    depends_on: [frps]
    networks: [frpnet]
    volumes:
      - server-state:/var/lib/flock
    restart: unless-stopped

  # M3 client skeleton placeholder (§7-M2 "1 client skeleton"); M2's client
  # assertions are executed by the host smoke tests.
  client-skeleton:
    image: alpine:3.20
    command: ["sleep", "infinity"]
    depends_on: [server]
    networks: [frpnet]

networks:
  frpnet: {}

volumes:
  server-state: {}
