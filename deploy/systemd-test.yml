# systemd-test.yml —— M6 systemd boot-autostart real-machine semantics, measured
# in containers (docs/design.md §7-M6.3/M6.6; results recorded in
# docs/manual/service-install.md, "Linux field test" section).
#
#   MSYS_NO_PATHCONV=1 docker compose -f deploy/systemd-test.yml up -d --build
#   bash deploy/systemd_assert.sh          # S1–S6 per-item PASS/FAIL; any FAIL ⇒ non-zero exit
#
# Topology (minimal direct form, config face modeled on m2-direct.yml):
#   server (Direct mode + M3 data plane: tun0 VIP 100.64.0.1;
#     server-systemd-test.toml bind-mounts over the in-image config —— endpoints
#     in the container-network view, server:9443)
#   client (Dockerfile.systemd-test: flock-client + systemd, PID 1 = /sbin/init;
#     --privileged + STOPSIGNAL SIGRTMIN+3 (compose file/Dockerfile) —— docker
#     restart of the container = a simulated "shutdown then boot", systemd
#     starts the service per the unit enablement)
#
# Assertion script deploy/systemd_assert.sh:
#   S1 install (install --config /etc/flock/client.toml → unit/is-enabled/daemon-reload)
#   S2 boot autostart (docker restart → systemctl is-active = active)
#   S3 VPN connectivity (tun0 appears + ping to server VIP 100.64.0.1 works)
#   S4 IPC (flock-client status → state=connected, vip correct)
#   S5 headless (no DISPLAY/DBus; no tray process; tray subcommand exits gracefully with code 0)
#   S6 exit semantics (IPC Shutdown → exit 0 without revival; docker restart autostarts again)

name: flock-systemd-test

services:
  server:
    build:
      context: ..               # isomorphic to m2-direct (Dockerfile.server-direct, no prepare needed)
      dockerfile: deploy/Dockerfile.server-direct
    image: flock/server:systemd-test
    # M3 data plane (tun0 VIP 100.64.0.1) + management face (in-container
    # 127.0.0.1:9444 —— device-add/invite).
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    volumes:
      - server-state:/var/lib/flock
      - ./server-systemd-test.toml:/etc/flock/server.toml:ro
    networks: [sdnet]
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.systemd-test
    image: flock/client:systemd-test
    depends_on: [server]
    hostname: sdclient
    # systemd needs cgroup write permission (--privileged includes it);
    # NET_ADMIN/tun are for the daemon's data plane.
    privileged: true
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    environment:
      - container=docker          # systemd container detection (avoids chroot/mount misdetection)
    networks: [sdnet]
    volumes:
      - client-state:/var/lib/flock
    restart: unless-stopped

networks:
  sdnet:
    name: flock-systemd-testnet

volumes:
  server-state: {}
  client-state: {}
