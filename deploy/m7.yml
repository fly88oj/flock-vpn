# m7.yml —— M7 client roster (docs/design.md §7-M7.7: m3 topology + a second client + peers field test).
#
#   docker compose -f deploy/m7.yml up -d --build
#   bash deploy/m7_assert.sh
#
# Topology (the frp-relay variant of m3.yml + two clients —— roster ≥3 entries:
# server + client-1/2):
#   frps (stock v0.71.1; user ports 27500/27501 reachable inside the container
#     network)
#     └─ server (Frp mode + M3 data plane: tun0 VIP 100.64.0.1; isomorphic to
#                m3, independent state volume)
#   client-1 / client-2 (flock-client; **service daemon form** (M7: IPC + login
#     keepalive), hostname=client-1/client-2 (the deterministic assertion source
#     for the roster's "hostname" column); the command is overridden to the
#     in-volume config /var/lib/flock/client.toml —— the [auth] username is
#     written by the m7_assert.sh bootstrap (the volume persists ⇒ container
#     rebuilds keep it)).
#
# Credential bootstrap (admin onboarding path, aligned with the existing m3
# script): gen-keys → server-side device-add --user m7cN → invite → ingest → vip
# → `flock-client login` (set password + login verification + hostname
# registered) → ready → restart (daemon takes over).

name: flock-m7

services:
  frps:
    build:
      context: build            # only Dockerfile.frps + frps.toml (committed)
      dockerfile: Dockerfile.frps
      additional_contexts:
        bins: ../.tmp/frp_0.71.1_linux_amd64
    image: flock/frps:0.71.1
    networks: [m7net]
    restart: unless-stopped

  server:
    build:
      context: ..               # workspace root (sources; .dockerignore trims target/.tmp)
      dockerfile: deploy/Dockerfile.server
      additional_contexts:
        frpbin: ../.tmp/frp_0.71.1_linux_amd64
      args:
        server_conf: server-m3.toml   # isomorphic to m3 (container-network-view endpoints + ticket_ttl 6s)
    image: flock/server:m7
    depends_on: [frps]
    # M3 data plane: the server itself is also a peer (tun + routes, §2.2).
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [m7net]
    volumes:
      - server-state:/var/lib/flock
    restart: unless-stopped

  client-1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: flock/client:m7
    depends_on: [server]
    hostname: client-1
    # service daemon form (M7: IPC + login keepalive + the peers face); the
    # config lives in the volume (written by the bootstrap).
    command: ["--config", "/var/lib/flock/client.toml", "service"]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [m7net]
    volumes:
      - client-1-state:/var/lib/flock
    restart: unless-stopped

  client-2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.client
    image: flock/client:m7
    depends_on: [server]
    hostname: client-2
    command: ["--config", "/var/lib/flock/client.toml", "service"]
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.conf.all.rp_filter: "1"
      net.ipv4.conf.default.rp_filter: "1"
    networks: [m7net]
    volumes:
      - client-2-state:/var/lib/flock
    restart: unless-stopped

networks:
  m7net:
    name: flock-m7net

volumes:
  server-state: {}
  client-1-state: {}
  client-2-state: {}
