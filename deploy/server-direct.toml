# server.toml —— Direct 模式（m2-direct.yml 内的唯一容器；docs/design.md §2.1/§3.11/§7-M2）。
#
# mode 缺省即 direct：直接监听容器 9443，零 frp 逻辑（不装配 chml-frpc、无子进程、
# 无 [frp] 段）。宿主映射 9443（主端点）+ 9444→9443（第二暴露口，换端点模拟）。
# 镜像 = Dockerfile.server-direct（内无任何 frp 二进制）。

state_dir = "/var/lib/chmlvpn"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "127.0.0.1:9443"
extra_endpoints = ["127.0.0.1:9444"]
dir_version = 1

ticket_ttl_secs = 6
