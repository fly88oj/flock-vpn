# server.toml —— Direct mode (the only container in m2-direct.yml; docs/design.md §2.1/§3.11/§7-M2).
#
# The default mode is direct: listen directly on the container's 9443, zero frp
# logic (no flock-frpc assembly, no subprocess, no [frp] section). Host mappings:
# 9443 (main endpoint) + 9444→9443 (second exposure, endpoint-change simulation).
# Image = Dockerfile.server-direct (no frp binaries inside).

state_dir = "/var/lib/flock"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "127.0.0.1:9443"
extra_endpoints = ["127.0.0.1:9444"]
dir_version = 1

ticket_ttl_secs = 6
