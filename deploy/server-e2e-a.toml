# server.toml —— e2e server-a (docs/design.md §6.2 M5: Frp access form + multi-primary voter 1).
#
# server-a/b's in-process listener is a local listener (bind 9443, reachable
# only over link-a); the frpc registration is carried by the **dedicated sidecar
# container frpc-a** (§6.2 "the test topology uses a dedicated sidecar container
# purely for networking needs —— the same Supervisor code, two deployments"; the
# in-process Supervisor form is covered by the m2/m3 deployments). The access
# endpoint = frps-a:23000 (client-visible).
# Multi-primary (§4): 3 voters interconnect via the srvmesh server-server
# profile (TCP fabric :9500, network aliases raft-1/2/3); tun VIP 100.64.0.1
# (§6.2; device VIPs are assigned by Raft starting at .11).

state_dir = "/var/lib/flock"
mode = "direct"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

advertise_endpoint = "frps-a:23000"
extra_endpoints = []
dir_version = 1

ticket_ttl_secs = 60

tun_name = "tun0"
vip = "100.64.0.1"

[sync]
mode = "raft"
bundle = "/var/lib/flock/bundle.bin"
raft_bind = "0.0.0.0:9500"
raft_peers = [
    "1=raft-1:9500",
    "2=raft-2:9500",
    "3=raft-3:9500",
]
