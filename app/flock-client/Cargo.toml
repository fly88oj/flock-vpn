[package]
name = "flock-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flock VPN client assembly (docs/design.md §2.3/§3.12/§7-M3): tun adapter (TunDevice seam) + connector backoff/endpoint rotation + IP packet ↔ PacketChannel data plane + route configuration"

[dependencies]
# Standalone protocol crate (formerly crates/flock-protocol, independently
# published since v0.1.0): the anchor feature (OPAQUE login anchor) keeps the
# same declaration as before extraction.
flock-protocol = { git = "https://github.com/fly88oj/flock-protocol.git", tag = "v0.1.0", features = ["anchor"] }
futures = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
# Control IPC (§7-M6.2: postcard over named pipe/Unix socket, frame format
# isomorphic to the admin plane).
postcard = { workspace = true }
# Connector main loop (multi-threaded rt + timed backoff).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
# M7 §7-M7.7: OS hostname source for hostname reporting (thin cross-platform
# gethostname wrapper, pure Rust).
hostname = "0.4"
# M7 peers latency probing: raw ICMP echo (socket2 creates SOCK_RAW/
# IPPROTO_ICMP; rationale in the ping.rs module docs — same API surface on all
# three platforms, tokio registration via from_std conversion).
socket2 = "0.6"
# M7 peers --json machine-readable output.
serde_json = "1"

# tun-rs platform adapter (§2.3): native paths on Linux/Windows/macOS;
# Android/iOS go through the fd injection seam (vpn-mesh §1.1 — the two
# platforms have no native equivalent API) and do not assemble the tun-rs
# build path.
[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
tun-rs = { workspace = true }

# Route configuration (§2.3: rtnetlink /16 pool pointing at the TUN +
# rp_filter=1) is Linux only. ksni (§7-M6 phase two) = Linux tray: pure Rust
# DBus StatusNotifierItem (zbus backend, tokio feature in the same domain as
# the existing runtime) — no GTK/libappindicator system dependencies.
# optional + pulled up only by the tray feature (headless
# --no-default-features build has zero GUI dependencies).
[target.'cfg(target_os = "linux")'.dependencies]
rtnetlink = { workspace = true }
ksni = { version = "0.3", default-features = false, features = ["tokio"], optional = true }

# Control IPC, Windows side (§7-M6.2): named pipe explicit DACL (SDDL) +
# token file ACL. Authorization = SDDL conversion/SetNamedSecurityInfo;
# Foundation = LocalFree. Tray (§7-M6 phase two) adds: WindowsAndMessaging =
# Win32 message pump (GetMessageW/PostThreadMessageW/DispatchMessageW — tray
# backend); Threading = GetCurrentThreadId; Globalization =
# GetUserDefaultUILanguage (lang.rs `auto` UI-language detection — facade
# declaration only). All facade-only (zero runtime dependencies), no GUI
# library surface.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Foundation", "Win32_System_EventLog", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Globalization"] }
# Service integration (§7-M6.3): SCM dispatcher + service install/recovery
# policy (compile-level verification; real-machine installation is on the
# manual checklist).
windows-service = "0.8"
# Tray autostart HKCU Run key + event log source registration (§7-M6.3).
winreg = "0.56"

# Tray (§7-M6 phase two): Windows/macOS use tray-icon (built-in muda menu
# consumed via the tray_icon::menu re-export — no direct muda dependency).
# default-features=false disables libappindicator (the GTK path for the
# Linux/BSD surface — not used on this platform).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
tray-icon = { version = "0.26", default-features = false, optional = true }

# macOS tray main loop (the tray-icon mac backend requires the main-thread
# NSApplication event loop): NSApplication/NSEvent = event draining;
# objc2-foundation = NSDate/NSDefaultRunLoopMode; objc2 = MainThreadMarker.
# Compile-level verification (no device; real-machine checklist pending).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"], optional = true }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSResponder", "NSEvent"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSObjCRuntime", "NSString", "NSDate", "NSRunLoop"], optional = true }

[dev-dependencies]
tempfile = "3"
# Test profile: tokio paused clock (start_paused + auto-advance) — the
# serve_conn 10s whole-chain timeout unit test advances instantly (no real
# 10s wait; test-util pulled up on the dev side only, never in the production
# feature set).
tokio = { workspace = true, features = ["test-util"] }

# §7-M6.5: tray feature gating. All GUI dependencies are target-gated,
# optional, and pulled up by tray (cargo limitation honestly declared:
# dep: references are a no-op on non-matching targets — a default Linux build
# never sees the tray-icon/objc2 surface, Windows never sees the ksni surface;
# --no-default-features is all zero on all three platforms).
[features]
default = ["tray"]
tray = [
  "dep:tray-icon",
  "dep:objc2",
  "dep:objc2-app-kit",
  "dep:objc2-foundation",
  "dep:ksni",
]
