[package]
name = "flock-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flock VPN 服务端装配（单服形态）：TCP :9443 E2E 会话 + 控制流（OPAQUE 登录锚/票据/设备注册表）+ ListenerMode 直连|frp（docs/design.md §2.2/§3.11/§7-M2）"

[dependencies]
flock-protocol = { path = "../../crates/flock-protocol", features = ["anchor"] }
flock-frpc = { path = "../../crates/flock-frpc" }
# M4 多主同步（§3.10/§4）：Raft 状态机 + 两级读目录 + 租约/转发承载 + Raft 内票据根。
# 可选档（feature `multi-primary`）——单服部署（m2/m2-direct 形态）默认构建零依赖面。
flock-sync = { path = "../../crates/flock-sync", optional = true }
# M3 数据面（§2.2 服务端自身也是 peer / §3.11「对上挂 tun 适配器」）：复用客户端 crate 的
# TunDevice/route/TunIo 接缝（§3.12 接缝落位客户端 crate，本 crate 是其第二个消费者）。
flock-client = { path = "../flock-client" }
# 控制流消息编码（§2.2：yamux stream0 postcard）与 server.toml 反序列化。
postcard = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
redb = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
# 每入连一会话任务 + accept 循环 + admin loopback 端点：workspace tokio 之上加多线程 rt。
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
# TCP keepalive（评审项 8：接受连接后设置——间隔对齐会话层 keepalive 10s）。
socket2 = "0.6"

[features]
default = []
# 多主装配（§2.2/§3.11 M4 批次）：NetBackend::Sync / Raft 票据根 / FRWD 转发面。
multi-primary = ["dep:flock-sync"]

[dev-dependencies]
# 集成测试（tests/control_flow.rs 全链 in-process；tests/multi_primary.rs 3 节点内存
# 集群——test-util = MemoryFabric 织物 + RTT 注入）多线程运行时。
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
flock-sync = { path = "../../crates/flock-sync", features = ["test-util"] }

# Direct 模式零 frp 逻辑（§2.1/§3.11 硬约束）：flock-frpc 的类型只允许出现在 src/frp.rs
# （Frp 分支装配）与 src/config.rs 的 FrpPlan 字段；Direct 代码路径（listener.rs 的
# Direct 分派、server.rs 的 accept/会话/控制流）不引用之——tests/listener_mode.rs 以
# 「Direct 起服后 frp run 目录不存在、监听句柄为 Direct 变体」做运行时守门。
