[package]
name = "flock-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flock VPN server assembly (single-server form): TCP :9443 E2E sessions + control flow (OPAQUE login anchor/tickets/device registry) + ListenerMode direct|frp (docs/design.md §2.2/§3.11/§7-M2)"

[dependencies]
# Standalone protocol repository (formerly crates/flock-protocol,
# independently published since v0.1.0): the anchor feature (OPAQUE login
# anchor) declaration carried over from before the extraction.
flock-protocol = { git = "https://github.com/fly88oj/flock-protocol.git", tag = "v0.1.0", features = ["anchor"] }
flock-frpc = { path = "../../crates/flock-frpc" }
# M4 multi-primary sync (§3.10/§4): Raft state machine + two-level-read
# directory + lease/forwarding carrier + the Raft-internal ticket root.
# The row types (DeviceRow/DeviceStatus/UserRow, review item 12 dedup) are
# the single authoritative definition —— a non-optional dependency; the
# multi-primary **assembly surface** (NetBackend::Sync/sync.rs/Raft ticket
# root) remains gated by the `multi-primary` feature, leaving single-server
# deployments' behavior unchanged.
flock-sync = { path = "../../crates/flock-sync" }
# M3 data plane (§2.2 the server itself is also a peer / §3.11 "hang a tun
# adapter on top"): reuses the client crate's TunDevice/route/TunIo seams
# (§3.12 places the seams in the client crate; this crate is their second
# consumer).
flock-client = { path = "../flock-client" }
# Control-flow message encoding (§2.2: yamux stream0 postcard) and
# server.toml deserialization.
postcard = { workspace = true }
serde = { workspace = true }
# M8 webui (§7-M8.4): the unified JSON error envelope/endpoint request and
# response bodies.
serde_json = { workspace = true }
# M8 webui (§7-M8.1/§M8.8): frontend asset embedding (include_dir, fixed;
# shell-page stage was index.html only).
include_dir = { workspace = true }
toml = { workspace = true }
redb = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
futures = { workspace = true }
# One session task per inbound connection + accept loops + the admin
# loopback endpoint: multi-thread rt on top of workspace tokio.
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
# TCP keepalive (review item 8: set after accepting a connection —— the
# interval aligned with the session-layer keepalive of 10s).
socket2 = "0.6"

[features]
default = []
# Multi-primary assembly (the §2.2/§3.11 M4 batch): NetBackend::Sync / the
# Raft ticket root / the FRWD forwarding surface.
# (flock-sync itself has been a resident dependency since review item 12 ——
# row-type dedup; the feature only gates the assembly surface.)
multi-primary = []

[dev-dependencies]
# Integration tests (tests/control_flow.rs full-chain in-process;
# tests/multi_primary.rs a 3-node in-memory cluster —— test-util =
# MemoryFabric + RTT injection) multi-threaded runtime.
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3"
flock-sync = { path = "../../crates/flock-sync", features = ["test-util"] }

# Direct mode has zero frp logic (the §2.1/§3.11 hard constraint):
# flock-frpc's types are allowed only in src/frp.rs (the Frp-branch
# assembly) and src/config.rs's FrpPlan fields; Direct code paths (the
# Direct dispatch in listener.rs, accept/sessions/control flow in
# server.rs) must not reference them —— tests/listener_mode.rs guards this
# at runtime with "after a Direct-mode server start, no frp run directory
# exists and the listen handle is the Direct variant".
