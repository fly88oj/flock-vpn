<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <!-- Static fallback only (no-JS); app.js re-renders it via t('app.name') and
       keeps <html lang> in sync with the active i18n pack. -->
  <title>Flock Admin Console</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/vendor/uplot.css">
  <style>[x-cloak]{display:none !important}</style>
  <!-- Order-sensitive (defer executes in document order): i18n → uPlot → wasm
       glue → app (registers alpine:init) → Alpine -->
  <script defer src="/static/i18n.js"></script>
  <script defer src="/static/vendor/uplot.min.js"></script>
  <script defer src="/static/vendor/flock_pake.js"></script>
  <script defer src="/static/app.js"></script>
  <script defer src="/static/vendor/alpine.min.js"></script>
</head>
<body x-data="flockApp()" x-init="boot()" @keydown.escape.window="onEsc()">

  <!-- ================================================================
       App shell (after sign-in) —— desktop ≥1200 fixed sidebar;
       <1200 topbar + drawer
       ================================================================ -->
  <div class="shell" x-show="authed" x-cloak>

    <!-- Sidebar / drawer -->
    <aside class="sidebar" :class="navOpen && 'open'">
      <div class="brand"><span class="brand-mark">F</span><span x-text="t('app.name')"></span></div>
      <nav class="nav" @click="navOpen = false">
        <a class="nav-link" :class="route==='dashboard' && 'active'" href="#/dashboard">
          <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
          <span x-text="t('nav.dashboard')"></span></a>
        <a class="nav-link" :class="route==='peers' && 'active'" href="#/peers">
          <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          <span x-text="t('nav.peers')"></span></a>
        <template x-if="isAdmin">
          <a class="nav-link" :class="route==='users' && 'active'" href="#/users">
            <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M17.5 14.3c2.4.7 4 2.5 4 5.7"/></svg>
            <span x-text="t('nav.users')"></span></a>
        </template>
        <template x-if="isAdmin">
          <a class="nav-link" :class="route==='audit' && 'active'" href="#/audit">
            <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
            <span x-text="t('nav.audit')"></span></a>
        </template>
        <a class="nav-link" :class="route==='settings' && 'active'" href="#/settings">
          <svg class="ico" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.5A7 7 0 0 0 5 12a7 7 0 0 0 .1 1.2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.5-2-1.5A7 7 0 0 0 19 12Z"/></svg>
          <span x-text="t('nav.settings')"></span></a>
      </nav>
      <div class="sidebar-foot">
        <div class="who">
          <span class="dot" :class="me && 'dot-on'"></span>
          <span x-text="me && me.user"></span>
          <span class="badge badge-admin" x-show="isAdmin" x-text="t('app.admin')"></span>
          <span class="badge badge-muted" x-show="!isAdmin" x-text="t('app.user')"></span>
        </div>
        <div x-text="me && (me.origin === 'vpn' ? t('nav.origin.vpn') : t('nav.origin.loopback'))"></div>
        <div x-text="sessionRemainText()"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:6px" @click="logout()" x-text="t('app.logout')"></button>
      </div>
    </aside>
    <div class="drawer-scrim" x-show="navOpen" x-cloak @click="navOpen=false"></div>

    <div class="main">
      <!-- Topbar (<1200): 24px brand tile for small/medium viewports (UI review item 9) -->
      <header class="topbar">
        <button class="icon-btn" @click="navOpen = !navOpen" :aria-label="t('nav.menu')" :aria-expanded="navOpen">
          <svg x-show="!navOpen" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          <svg x-show="navOpen" x-cloak viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <span class="brand-mark brand-mark-sm" aria-hidden="true">F</span>
        <strong x-text="t('app.name')"></strong>
      </header>

      <main class="content">

        <!-- ================= Dashboard ================= -->
        <section x-show="route==='dashboard'">
          <div class="page-head">
            <div>
              <h1 x-text="t('nav.dashboard')"></h1>
              <div class="page-sub" x-text="t('dash.subtitle', {cluster: shortId(bootstrap && bootstrap.cluster_id)})"></div>
            </div>
            <button class="btn btn-outline" @click="loadDashboard()" :disabled="dashBusy">
              <span class="spin" x-show="dashBusy"></span><span x-text="t('app.refresh')"></span></button>
          </div>

          <template x-if="dashError">
            <div class="card"><div class="state">
              <span class="icon">!</span><span x-text="t('app.error')"></span>
              <button class="btn btn-sm" @click="loadDashboard()" x-text="t('app.retry')"></button>
            </div></div>
          </template>

          <template x-if="summary">
            <div class="stack">
              <!-- Cluster + servers side by side (round2 review item 8):
                   desktop (≥1200) cluster card | servers area, equal height on
                   the same row —— single-server deployments let the server card
                   fill the right column, removing the 1/3-width gap;
                   <1200 falls back to single-column stacking via block defaults. -->
              <div class="dash-top">
                <!-- Cluster card: three equal segments (ID / epoch / sync mode) -->
                <div class="card">
                  <div class="kicker" x-text="t('dash.cluster')"></div>
                  <div class="kv-cols">
                    <div class="kv-cell"><span class="k" x-text="t('dash.cluster.id')"></span>
                      <span class="v mono" :title="summary.cluster.cluster_id" x-text="shortId(summary.cluster.cluster_id)"></span></div>
                    <div class="kv-cell"><span class="k" x-text="t('dash.cluster.epoch')"></span>
                      <span class="v num mono" x-text="summary.cluster.epoch"></span></div>
                    <div class="kv-cell"><span class="k" x-text="t('dash.cluster.mode')"></span>
                      <span class="v" x-text="summary.cluster.sync_mode === 'raft' ? t('settings.sync.raft') : t('settings.sync.single')"></span></div>
                  </div>
                </div>

                <!-- Server cards (leader badge / epoch / online) -->
                <div class="dash-servers">
                  <div class="kicker" style="margin-bottom:8px" x-text="t('dash.servers')"></div>
                  <div class="servers-grid">
                    <template x-for="s in (summary.servers || [])" :key="s.node_id">
                      <div class="card">
                        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
                          <button type="button" class="id-chip mono" :title="idChipTitle(s.node_id)"
                                  @click="copyText(s.node_id)"
                                  x-text="t('dash.servers.node', {id: shortNum(s.node_id)})"></button>
                          <span class="badge" :class="s.leader ? 'badge-accent' : 'badge-muted'" x-text="s.leader ? t('dash.servers.leader') : t('dash.servers.follower')"></span>
                        </div>
                        <div class="kv-row"><span class="k">VIP</span><span class="v mono" x-text="s.vip"></span></div>
                        <div class="kv-row"><span class="k" x-text="t('settings.advertise_endpoint')"></span><span class="v mono ellipsis" x-text="s.endpoint || '—'"></span></div>
                        <div class="kv-row"><span class="k" x-text="t('dash.cluster.epoch')"></span><span class="v num mono" x-text="s.epoch"></span></div>
                        <div class="kv-row"><span class="k" x-text="t('peers.col.status')"></span>
                          <span class="v" style="display:inline-flex;align-items:center;gap:6px">
                            <span class="dot" :class="s.online && 'dot-on'"></span>
                            <span x-text="s.online ? t('app.online') : t('app.offline')"></span></span></div>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Totals -->
              <div>
                <div class="kicker" style="margin-bottom:8px" x-text="t('dash.totals')"></div>
                <div class="stat-grid">
                  <div class="stat"><div class="stat-label" x-text="t('dash.totals.devices')"></div><div class="stat-value num" x-text="summary.totals.devices"></div></div>
                  <div class="stat"><div class="stat-label" x-text="t('dash.totals.devices_active')"></div><div class="stat-value num" x-text="summary.totals.devices_active"></div></div>
                  <div class="stat"><div class="stat-label" x-text="t('dash.totals.devices_online')"></div><div class="stat-value num" x-text="summary.totals.devices_online"></div></div>
                  <div class="stat"><div class="stat-label" x-text="t('dash.totals.users')"></div><div class="stat-value num" x-text="summary.totals.users"></div></div>
                  <div class="stat"><div class="stat-label" x-text="t('dash.totals.tx')"></div><div class="stat-value num" x-html="fmtBpsStat(summary.totals.tx_bps_sum)"></div></div>
                  <div class="stat"><div class="stat-label" x-text="t('dash.totals.rx')"></div><div class="stat-value num" x-html="fmtBpsStat(summary.totals.rx_bps_sum)"></div></div>
                </div>
              </div>

              <!-- This server -->
              <div class="card">
                <div class="kicker" x-text="t('dash.self')"></div>
                <div class="grid grid-2" style="margin-top:8px">
                  <div class="kv-row"><span class="k" x-text="t('dash.self.server_id')"></span><span class="v mono" x-text="shortId(summary.self && summary.self.server_id)"></span></div>
                  <div class="kv-row"><span class="k"></span><span class="v" x-text="t('dash.self.uptime', {dur: fmtDur(summary.self && summary.self.uptime_secs)})"></span></div>
                </div>
              </div>

              <!-- Traffic chart -->
              <div class="card">
                <div class="chart-toolbar">
                  <div class="kicker" x-text="t('dash.chart')"></div>
                  <label x-text="t('dash.chart.select')"></label>
                  <select class="input" style="width:auto;min-height:36px" x-model="chartVip" @change="loadSeries()">
                    <template x-for="p in chartPeers()" :key="p.device_id">
                      <option :value="p.vip" x-text="p.vip + ' · ' + hostName(p.hostname)"></option>
                    </template>
                  </select>
                  <span class="field-hint" x-text="t('dash.chart.hint')"></span>
                </div>
                <div class="chart-box">
                  <div id="traffic-chart" style="width:100%"></div>
                  <div class="chart-tooltip" id="chart-tooltip"></div>
                  <template x-if="seriesEmpty()">
                    <div class="state state-empty">
                      <svg class="state-ico" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 17l5-6 4 3 6-8"/><path d="M3 21h18"/></svg>
                      <span x-text="t('dash.chart.empty')"></span>
                    </div>
                  </template>
                </div>
                <!-- Two-series legend (round2 review item 1): hand-drawn DOM
                     (uPlot's built-in legend is off), identical on desktop and
                     mobile; swatch color matches the line (single definition in
                     app.js CHART_*_COLOR); hover readouts share source and units
                     with the tooltip. -->
                <div class="chart-legend" x-show="!seriesEmpty()" x-cloak>
                  <span class="lg-item"><i class="lg-sw" :style="'background:' + chartTxColor()"></i>
                    <span x-text="t('dash.chart.tx')"></span>
                    <b class="mono" x-text="legendTx">--</b></span>
                  <span class="lg-item"><i class="lg-sw" :style="'background:' + chartRxColor()"></i>
                    <span x-text="t('dash.chart.rx')"></span>
                    <b class="mono" x-text="legendRx">--</b></span>
                </div>
              </div>
            </div>
          </template>

          <template x-if="!summary && !dashError">
            <div class="card"><div class="state"><span class="spinner"></span><span x-text="t('app.loading')"></span></div></div>
          </template>
        </section>

        <!-- ================= Devices ================= -->
        <section x-show="route==='peers'">
          <div class="page-head">
            <div>
              <h1 x-text="t('nav.peers')"></h1>
              <div class="page-sub" x-text="t('peers.subtitle')"></div>
            </div>
            <button class="btn btn-outline" @click="loadPeers()" :disabled="peersBusy">
              <span class="spin" x-show="peersBusy"></span><span x-text="t('app.refresh')"></span></button>
          </div>

          <template x-if="peersError">
            <div class="card"><div class="state">
              <span class="icon">!</span><span x-text="errMsg(peersError)"></span>
              <button class="btn btn-sm" @click="loadPeers()" x-text="t('app.retry')"></button>
            </div></div>
          </template>
          <template x-if="!peersLoaded && !peersError">
            <div class="card"><div class="state"><span class="spinner"></span><span x-text="t('app.loading')"></span></div></div>
          </template>
          <template x-if="peersLoaded && !peersError && peers.length === 0">
            <div class="card"><div class="state state-empty">
              <svg class="state-ico" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
              <span x-text="t('peers.empty')"></span>
            </div></div>
          </template>

          <template x-if="peersLoaded && !peersError && peers.length > 0">
            <div class="table-card"><div class="table-scroll">
              <table class="table">
                <thead><tr>
                  <th x-text="t('peers.col.vip')"></th>
                  <th x-text="t('peers.col.hostname')"></th>
                  <th x-text="t('peers.col.owner')"></th>
                  <th x-text="t('peers.col.kind')"></th>
                  <!-- Status column, three shapes (round2 review item 5): header
                       "Status/Online" + hover legend —— dot = online state
                       (green online / grey offline), text = lifecycle
                       (active/disabled/revoked); the two are decoupled: revoked
                       keeps its red badge while the dot only tracks `online`. -->
                  <th :title="t('peers.col.status.legend')" x-text="t('peers.col.status')"></th>
                  <th class="hide-narrow th-num" x-text="t('peers.col.lastseen')"></th>
                  <th class="th-num" x-text="t('peers.col.traffic')"></th>
                  <th x-show="isAdmin" x-text="t('peers.col.actions')"></th>
                </tr></thead>
                <tbody>
                  <template x-for="p in peers" :key="p.device_id">
                    <tr :title="p.device_id">
                      <td :data-label="t('peers.col.vip')" class="cell-vip"><span class="mono v-vip" x-text="p.vip"></span></td>
                      <td :data-label="t('peers.col.hostname')" class="ellipsis">
                        <span :class="hostUnknown(p.hostname) && 'muted'" x-text="hostName(p.hostname)"></span></td>
                      <td :data-label="t('peers.col.owner')" class="ellipsis">
                        <template x-if="isNumId(p.owner)">
                          <button type="button" class="id-chip mono" :title="idChipTitle(p.owner)"
                                  @click="copyText(p.owner)" x-text="shortNum(p.owner)"></button>
                        </template>
                        <template x-if="!isNumId(p.owner)">
                          <span x-text="p.owner"></span>
                        </template>
                      </td>
                      <td :data-label="t('peers.col.kind')"><span class="badge" :class="p.kind==='server' ? 'badge-info' : 'badge-muted'" x-text="p.kind==='server' ? t('app.server') : t('app.device')"></span></td>
                      <td :data-label="t('peers.col.status')"><span :title="t('peers.col.status.legend')" style="display:inline-flex;align-items:center;gap:6px">
                        <span class="dot" :class="p.online && 'dot-on'"></span>
                        <span class="badge" :class="statusBadge(p.status)" x-text="t('peers.status.' + p.status)"></span></span></td>
                      <td :data-label="t('peers.col.lastseen')" class="num td-num hide-narrow" x-text="fmtAgo(p.last_seen_unix)"></td>
                      <td :data-label="t('peers.col.traffic')" class="td-num">
                        <!-- Traffic split into ↑/↓ rows, right-aligned monospace (UI review item 6) -->
                        <span class="traffic-pair mono">
                          <span class="tp-row"><span class="tp-arrow">↑</span><span class="tp-v" x-text="fmtBps(p.tx_bps)"></span></span>
                          <span class="tp-row"><span class="tp-arrow">↓</span><span class="tp-v" x-text="fmtBps(p.rx_bps)"></span></span>
                        </span>
                      </td>
                      <td data-label="" x-show="isAdmin">
                        <!-- Stable control set (review item 5): server rows get no
                             revoke/disable/enable; terminal rows keep a greyed
                             "Revoke" placeholder so the action column does not
                             raggedly resize; high-risk actions (disable/revoke)
                             are separated from the rest via .acts-sep. -->
                        <div class="row-actions">
                          <span class="actions-none" x-show="p.kind==='server'">—</span>
                          <button class="btn btn-success btn-sm" x-show="p.kind==='device' && p.status==='disabled'" @click="confirmPeer(p, 'enable')" x-text="t('peers.act.enable')"></button>
                          <button class="btn btn-ghost btn-sm" x-show="p.kind==='device' && p.status==='active'" @click="confirmPeer(p, 'kick')" x-text="t('peers.act.kick')"></button>
                          <span class="acts-sep" x-show="p.kind==='device' && (p.status==='active' || p.status==='disabled')"></span>
                          <button class="btn btn-warn btn-sm" x-show="p.kind==='device' && p.status==='active'" @click="confirmPeer(p, 'disable')" x-text="t('peers.act.disable')"></button>
                          <button class="btn btn-danger btn-sm" x-show="p.kind==='device' && (p.status==='active' || p.status==='disabled')" @click="confirmPeer(p, 'revoke')" x-text="t('peers.act.revoke')"></button>
                          <button class="btn btn-danger btn-sm is-placeholder" x-show="p.kind==='device' && (p.status==='revoked' || p.status==='expired')"
                                  disabled :title="t('peers.act.terminal')" x-text="t('peers.act.revoke')"></button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div></div>
          </template>
        </section>

        <!-- ================= Accounts (admin) ================= -->
        <section x-show="route==='users'">
          <div class="page-head">
            <div>
              <h1 x-text="t('nav.users')"></h1>
              <div class="page-sub" x-text="t('users.subtitle')"></div>
            </div>
            <button class="btn btn-outline" @click="loadUsers()" :disabled="usersBusy">
              <span class="spin" x-show="usersBusy"></span><span x-text="t('app.refresh')"></span></button>
          </div>

          <!-- No-permission page (frontend rendering of a direct API 403) -->
          <template x-if="usersForbidden">
            <div class="card"><div class="state">
              <span class="icon">⊘</span><strong x-text="t('app.noperm.title')"></strong>
              <span x-text="t('app.noperm.body')"></span>
            </div></div>
          </template>

          <template x-if="!usersForbidden">
            <div>
              <!-- Create -->
              <div class="card" style="margin-bottom:24px">
                <div class="card-title" x-text="t('users.create.title')"></div>
                <form @submit.prevent="createUser()" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start">
                  <div class="field" style="flex:1 1 240px;margin-bottom:0">
                    <input class="input" x-model="createUserName" :placeholder="t('users.create.name.ph')"
                           :aria-label="t('users.create.name')" maxlength="32" autocomplete="off">
                    <div class="field-error" x-text="createUserError"></div>
                  </div>
                  <button class="btn btn-primary" type="submit" :disabled="createUserBusy" style="min-width:140px">
                    <span class="spin" x-show="createUserBusy"></span><span x-text="t('users.create.submit')"></span></button>
                </form>
              </div>

              <template x-if="usersError">
                <div class="card"><div class="state"><span class="icon">!</span><span x-text="errMsg(usersError)"></span>
                  <button class="btn btn-sm" @click="loadUsers()" x-text="t('app.retry')"></button></div></div>
              </template>
              <template x-if="!usersError && users.length === 0">
                <div class="card"><div class="state state-empty">
                  <svg class="state-ico" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M17.5 14.3c2.4.7 4 2.5 4 5.7"/></svg>
                  <span x-text="t('users.empty')"></span>
                </div></div>
              </template>
              <template x-if="!usersError && users.length > 0">
                <div class="table-card"><div class="table-scroll">
                  <table class="table">
                    <thead><tr>
                      <th x-text="t('users.col.username')"></th>
                      <th x-text="t('users.col.role')"></th>
                      <th x-text="t('users.col.disabled')"></th>
                      <th class="hide-narrow" x-text="t('users.col.password')"></th>
                      <th class="th-num" x-text="t('users.col.devices')"></th>
                      <th x-text="t('users.col.actions')"></th>
                    </tr></thead>
                    <tbody>
                      <template x-for="u in users" :key="u.username">
                        <tr>
                          <td :data-label="t('users.col.username')"><span x-text="u.username"></span>
                            <span class="field-hint" x-show="me && u.username === me.user" x-text="t('users.me')"></span></td>
                          <td :data-label="t('users.col.role')"><span class="badge" :class="u.admin ? 'badge-admin' : 'badge-muted'" x-text="u.admin ? t('users.role.admin') : t('users.role.plain')"></span></td>
                          <td :data-label="t('users.col.disabled')"><span class="badge" :class="u.disabled ? 'badge-danger' : 'badge-success'" x-text="u.disabled ? t('users.disabled.yes') : t('users.disabled.no')"></span></td>
                          <!-- Password badge (round2 review item 6): "Not set" as
                               an amber-outlined pill —— draws the required
                               attention; "Set" keeps the grey pill. -->
                          <td :data-label="t('users.col.password')" class="hide-narrow"><span class="badge" :class="u.has_password ? 'badge-muted' : 'badge-outline-warn'" x-text="u.has_password ? t('users.password.set') : t('users.password.none')"></span></td>
                          <td :data-label="t('users.col.devices')" class="num td-num" x-text="u.devices"></td>
                          <td data-label="">
                            <div class="row-actions">
                              <!-- Self-row guard (round2 review item 4): remove-admin
                                   / disable greyed out with a tooltip (backend 409
                                   remains the backstop); reset password stays
                                   available. -->
                              <button class="btn btn-success btn-sm" x-show="u.disabled" :disabled="busyKey !== ''" @click="userEnable(u)" x-text="t('users.act.enable')"></button>
                              <button class="btn btn-ghost btn-sm" :disabled="busyKey !== '' || (isSelf(u) && u.admin)"
                                      :title="isSelf(u) && u.admin ? t('users.act.self.blocked') : null"
                                      @click="confirmUserAdmin(u, !u.admin)" x-text="u.admin ? t('users.act.unsetadmin') : t('users.act.setadmin')"></button>
                              <span class="acts-sep"></span>
                              <button class="btn btn-ghost btn-sm" :disabled="busyKey !== ''" @click="userResetPw(u)" x-text="t('users.act.resetpw')"></button>
                              <button class="btn btn-warn btn-sm" x-show="!u.disabled" :disabled="busyKey !== '' || isSelf(u)"
                                      :title="isSelf(u) ? t('users.act.self.blocked') : null"
                                      @click="confirmUserDisable(u)" x-text="t('users.act.disable')"></button>
                              <button class="btn btn-warn btn-sm is-placeholder" x-show="u.disabled" disabled :title="t('users.act.disabled.disabled')" x-text="t('users.act.disable')"></button>
                            </div>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div></div>
              </template>
            </div>
          </template>
        </section>

        <!-- ================= Audit (admin) ================= -->
        <section x-show="route==='audit'">
          <div class="page-head">
            <div>
              <h1 x-text="t('nav.audit')"></h1>
              <div class="page-sub" x-text="t('audit.subtitle')"></div>
            </div>
            <button class="btn btn-outline" @click="loadAudit()" :disabled="auditBusy">
              <span class="spin" x-show="auditBusy"></span><span x-text="t('app.refresh')"></span></button>
          </div>

          <template x-if="auditForbidden">
            <div class="card"><div class="state"><span class="icon">⊘</span><strong x-text="t('app.noperm.title')"></strong>
              <span x-text="t('app.noperm.body')"></span></div></div>
          </template>
          <template x-if="auditError">
            <div class="card"><div class="state"><span class="icon">!</span><span x-text="errMsg(auditError)"></span>
              <button class="btn btn-sm" @click="loadAudit()" x-text="t('app.retry')"></button></div></div>
          </template>
          <template x-if="!auditError && !auditForbidden && audit.length === 0 && auditLoaded">
            <div class="card"><div class="state state-empty">
              <svg class="state-ico" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16M4 10h16M4 15h10M4 20h7"/></svg>
              <span x-text="t('audit.empty')"></span>
            </div></div>
          </template>
          <template x-if="!auditError && audit.length > 0">
            <div class="table-card"><div class="table-scroll">
              <table class="table">
                <thead><tr>
                  <th x-text="t('audit.col.time')"></th>
                  <th x-text="t('audit.col.user')"></th>
                  <th x-text="t('audit.col.action')"></th>
                  <th x-text="t('audit.col.target')"></th>
                  <th class="hide-narrow" x-text="t('audit.col.origin')"></th>
                  <th x-text="t('audit.col.result')"></th>
                </tr></thead>
                <tbody>
                  <template x-for="(e, i) in audit" :key="i">
                    <tr>
                      <td :data-label="t('audit.col.time')" class="num mono" x-text="fmtTime(e.ts)"></td>
                      <td :data-label="t('audit.col.user')" class="ellipsis" x-text="e.user"></td>
                      <td :data-label="t('audit.col.action')" x-text="t('audit.action.' + e.action)"></td>
                      <td :data-label="t('audit.col.target')" class="mono ellipsis" x-text="shortTarget(e.target)"></td>
                      <td :data-label="t('audit.col.origin')" class="hide-narrow" x-text="e.origin"></td>
                      <!-- Result badge (round2 review item 7): "OK" for high-risk
                           actions (revoke/disable/reset password/role change) uses
                           the amber tier; denied/error stay red. -->
                      <td :data-label="t('audit.col.result')"><span class="badge" :class="auditResultBadge(e)" x-text="t('audit.result.' + e.result)"></span></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div></div>
          </template>
        </section>

        <!-- ================= Settings ================= -->
        <section x-show="route==='settings'">
          <div class="page-head">
            <div>
              <h1 x-text="t('nav.settings')"></h1>
              <div class="page-sub" x-text="t('settings.subtitle')"></div>
            </div>
          </div>
          <template x-if="config">
            <div class="card">
              <div class="kv">
                <div class="kv-row"><span class="k" x-text="t('settings.listen_mode')"></span><span class="v" x-text="config.listen_mode === 'frp' ? t('settings.mode.frp') : t('settings.mode.direct')"></span></div>
                <div class="kv-row"><span class="k" x-text="t('settings.advertise_endpoint')"></span><span class="v mono" x-text="config.advertise_endpoint"></span></div>
                <div class="kv-row"><span class="k" x-text="t('settings.sync_mode')"></span><span class="v" x-text="config.sync_mode === 'raft' ? t('settings.sync.raft') : t('settings.sync.single')"></span></div>
                <div class="kv-row"><span class="k" x-text="t('settings.ticket_ttl_secs')"></span><span class="v num mono" x-text="config.ticket_ttl_secs"></span></div>
                <div class="kv-row"><span class="k" x-text="t('settings.peer_retention_days')"></span><span class="v num mono" x-text="config.peer_retention_days"></span></div>
                <div class="kv-row"><span class="k" x-text="t('settings.max_sessions')"></span><span class="v num mono" x-text="config.max_sessions"></span></div>
                <div class="kv-row"><span class="k" x-text="t('settings.webui.port')"></span><span class="v num mono" x-text="config.webui && config.webui.port"></span></div>
                <div class="kv-row"><span class="k" x-text="t('settings.webui.session_ttl_secs')"></span><span class="v num mono" x-text="config.webui && config.webui.session_ttl_secs"></span></div>
                <!-- Language switch (persisted to localStorage; en is the
                     default pack, zh the alternative) -->
                <div class="kv-row"><span class="k" x-text="t('app.language')"></span>
                  <select class="input" style="width:auto;min-height:36px" x-model="lang" @change="setLang($event.target.value)" :aria-label="t('app.language')">
                    <option value="en" x-text="t('lang.en')"></option>
                    <option value="zh" x-text="t('lang.zh')"></option>
                  </select></div>
              </div>
            </div>
          </template>
        </section>

      </main>
    </div>
  </div>

  <!-- ================================================================
       Login page (centered across all three breakpoints)
       ================================================================ -->
  <div class="auth-wrap" x-show="route==='login'" x-cloak>
    <div class="card auth-card">
      <div class="brand-lg"><span class="brand-mark">F</span></div>
      <h1 class="auth-title" x-text="t('login.title')"></h1>
      <p class="auth-sub" x-text="t('login.subtitle')"></p>
      <!-- Cluster / server IDs in mono (UI review item 15) -->
      <div class="field-hint" style="text-align:center;margin-bottom:12px">
        <template x-if="bootstrap">
          <span><span x-text="t('login.bootstrap.cluster')"></span> <span class="mono" x-text="shortId(bootstrap.cluster_id)"></span>
            · <span x-text="t('login.bootstrap.server')"></span> <span class="mono" x-text="shortId(bootstrap.server_id)"></span></span>
        </template>
        <template x-if="!bootstrap">
          <span x-text="t('login.bootstrap.unreachable')"></span>
        </template>
      </div>
      <form @submit.prevent="submitLogin()">
        <div class="field">
          <label for="login-user" x-text="t('login.username')"></label>
          <input id="login-user" class="input" :class="loginError && 'input-error'" x-model="loginUser" :placeholder="t('login.username.ph')"
                 autocomplete="username" autocapitalize="none" spellcheck="false" :disabled="loginBusy">
        </div>
        <div class="field">
          <label for="login-pass" x-text="t('login.password')"></label>
          <input id="login-pass" class="input" :class="loginError && 'input-error'" type="password" x-model="loginPass" :placeholder="t('login.password.ph')"
                 autocomplete="current-password" :disabled="loginBusy">
        </div>
        <div class="field-error field-error-fixed" x-text="loginErrorText"></div>
        <button class="btn btn-primary btn-block" type="submit" :disabled="loginBusy" style="min-height:44px">
          <span class="spin" x-show="loginBusy"></span>
          <span x-text="loginBusy ? t('login.busy') : t('login.submit')"></span></button>
      </form>
      <div class="auth-alt"><span x-text="t('login.setpw')"></span>
        <a class="auth-link" href="#/set-password" x-text="t('login.setpw.go')"></a></div>
      <!-- Language switch (login page placement; persisted to localStorage,
           bootstrap `lang` only seeds the first visit) -->
      <div class="auth-alt">
        <span x-text="t('app.language')"></span>
        <select class="input" style="width:auto;min-height:36px;margin-left:8px" x-model="lang" @change="setLang($event.target.value)" :aria-label="t('app.language')">
          <option value="en" x-text="t('lang.en')"></option>
          <option value="zh" x-text="t('lang.zh')"></option>
        </select>
      </div>
    </div>
  </div>

  <!-- ================================================================
       Set-password page (first-time / reset; centered across breakpoints)
       ================================================================ -->
  <div class="auth-wrap" x-show="route==='set-password'" x-cloak>
    <div class="card auth-card">
      <h1 class="auth-title" x-text="t('setpw.title')"></h1>
      <p class="auth-sub" x-text="t('setpw.subtitle')"></p>
      <form @submit.prevent="submitSetPw()">
        <div class="field">
          <label for="pw-user" x-text="t('setpw.username')"></label>
          <input id="pw-user" class="input" :class="pwError && 'input-error'" x-model="pwUser" autocomplete="username" autocapitalize="none" spellcheck="false" :disabled="pwBusy">
        </div>
        <div class="field">
          <label for="pw-token" x-text="t('setpw.token')"></label>
          <input id="pw-token" class="input mono" :class="pwError && 'input-error'" x-model="pwToken" :placeholder="t('setpw.token.ph')" autocomplete="off" spellcheck="false" :disabled="pwBusy">
        </div>
        <div class="field">
          <label for="pw-pass" x-text="t('setpw.newpass')"></label>
          <input id="pw-pass" class="input" :class="pwError && 'input-error'" type="password" x-model="pwPass" autocomplete="new-password" :disabled="pwBusy">
        </div>
        <div class="field">
          <label for="pw-pass2" x-text="t('setpw.newpass2')"></label>
          <input id="pw-pass2" class="input" :class="pwError && 'input-error'" type="password" x-model="pwPass2" autocomplete="new-password" :disabled="pwBusy">
        </div>
        <div class="field-error field-error-fixed" x-text="pwErrorText"></div>
        <button class="btn btn-primary btn-block" type="submit" :disabled="pwBusy" style="min-height:44px">
          <span class="spin" x-show="pwBusy"></span>
          <span x-text="pwBusy ? t('setpw.busy') : t('setpw.submit')"></span></button>
      </form>
      <div class="auth-alt"><a class="auth-link" href="#/login" x-text="t('setpw.go.login')"></a></div>
    </div>
  </div>

  <!-- ================================================================
       Modal: confirm operation
       ================================================================ -->
  <div class="modal-overlay" x-show="confirmModal" x-cloak @click.self="confirmModal=null">
    <div class="modal" role="dialog" aria-modal="true">
      <!-- Title warning icon (round2 review item 9): revoke = red /
           disable & demotion = amber; the action row's two buttons share a
           uniform 40px height via .modal-actions .btn. -->
      <h3 class="modal-title">
        <span class="modal-title-ico" x-show="confirmModal && confirmModal.level" x-cloak
              :class="confirmModal && confirmModal.level === 'danger' ? 'ico-danger' : 'ico-warn'" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4 2.8 20h18.4L12 4z"/><path d="M12 10v4.5"/><path d="M12 17.6v.01"/></svg>
        </span>
        <span x-text="confirmModal && confirmModal.title"></span>
      </h3>
      <p x-text="confirmModal && confirmModal.body"></p>
      <div class="modal-actions">
        <button class="btn btn-ghost" @click="confirmModal=null" x-text="t('app.cancel')"></button>
        <button class="btn" :class="confirmModal && (confirmModal.level === 'danger' ? 'btn-danger' : confirmModal.level === 'warn' ? 'btn-warn' : 'btn-primary')"
                :disabled="actionBusy" @click="doConfirmed()">
          <span class="spin" x-show="actionBusy"></span>
          <span x-text="t('app.confirm')"></span></button>
      </div>
    </div>
  </div>

  <!-- Modal: one-time bootstrap token -->
  <div class="modal-overlay" x-show="tokenModal" x-cloak @click.self="tokenModal=null">
    <div class="modal" role="dialog" aria-modal="true">
      <h3 class="modal-title" x-text="tokenModal && t(tokenModal.title)"></h3>
      <p x-text="t('users.token.body')"></p>
      <div class="token-box"><span class="mono" style="flex:1" x-text="tokenModal && tokenModal.token"></span>
        <button class="btn btn-sm" @click="copyToken()" x-text="copied ? t('app.copied') : t('app.copy')"></button></div>
      <!-- Security notice + delivery guidance merged into one amber ⓘ notice
           (UI review item 15) -->
      <div class="token-notice">
        <span class="token-notice-ico" aria-hidden="true">ⓘ</span>
        <span x-text="t('users.token.hint', {user: tokenModal && tokenModal.user})"></span>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" @click="tokenModal=null" x-text="t('app.close')"></button>
        <a class="btn btn-primary" href="#/set-password" @click="prefillPwUser(); tokenModal=null" x-text="t('users.token.go')"></a>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast-stack">
    <template x-for="toast in toasts" :key="toast.id">
      <div class="toast" :class="'toast-' + toast.kind"><span x-text="toast.text"></span></div>
    </template>
  </div>

</body>
</html>
