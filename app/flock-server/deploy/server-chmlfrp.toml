# server.toml —— Frp mode · ChmlFrp-generation example (review item 14;
# docs/design.md §2.1/§3.9).
#
# Differences from server-frp.toml (the original generation) are confined to
# the [frp] section:
# - flavor = "chmlfrp": take the ChmlFrp panel node (ChmlFrp-0.51.2_251023
#   pinned frpc);
# - chmlfrp_ini: the on-machine path of the frpc.ini exported by the panel's
#   "tunnel management → config file" (the default ConfigFile mode —— `frpc
#   -c <ini>`, panel parameters passed through byte-for-byte, injecting only
#   the admin probe fields);
# - frpc_bin points at the ChmlFrp-pinned frpc binary (the R9 version
#   matrix: chmlfrp generation × ChmlFrp-pinned).
#
# Copy to /etc/flock/server.toml and adjust advertise/extra per the
# deployment (= the panel tunnel's user ports).
# Note: the example lives in app/flock-server/deploy/ (this batch's file
# modification scope; the image archives in the repository-root deploy/ are
# synced by the operations side as needed).

state_dir = "/var/lib/flock"
mode = "frp"
bind = "0.0.0.0:9443"
admin_bind = "127.0.0.1:9444"

# The client-visible endpoint = the ChmlFrp panel tunnel's user port
# (host:port matching the panel).
advertise_endpoint = "chml.example.net:27500"
extra_endpoints = ["chml.example.net:27501"]
dir_version = 1
ticket_ttl_secs = 60
max_sessions = 1024

[frp]
flavor = "chmlfrp"
# The panel-exported frpc.ini (operations pastes it from the panel's "tunnel
# management → config file" onto the machine; the server only reads it).
chmlfrp_ini = "/etc/flock/chmlfrp-panel.ini"
# The ChmlFrp-pinned frpc binary (the R9 matrix: paired with the chmlfrp
# generation; cross-pairing with the original forbidden).
frpc_bin = "/usr/local/bin/chmlfrpc"

# —— Optional: explicit UserTokenAuto opt-in (off by default) ——
# R20 risk (must read before enabling; same text in flock-frpc spec.rs):
# - the panel usertoken is an all-powerful credential, and the bootstrap
#   pulls it over InsecureSkipVerify HTTPS (interceptable by a
#   man-in-the-middle); the token lands in the subprocess command line
#   (readable via ps on the same machine); the pulled config is opaque to
#   the management layer.
# Do not enable on organizational/multi-user machines; on a personal
# machine, accept the risk and uncomment:
#
# [frp.user_token_auto]
# usertoken = "<panel usertoken — never commit to a repository>"
# tunnel_id = 123456
