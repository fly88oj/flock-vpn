# CI —— three-platform matrix gate (one-to-one with the "common gate command
# list" in CONTRIBUTING.md).
#
# Container e2e is not run here (deploy/'s smoke/assertion-tier #[ignore] tests
# stay out of CI), for these reasons:
#   1. Topology semantics are host-bound: smoke actually connects to the "host
#      mapped ports" (127.0.0.1:9443/27500 etc.); a GitHub runner has no
#      equivalent of Docker Desktop's port publishing / multi-container
#      networking semantics;
#   2. The relay tier needs the prepare assets (frp v0.71.1 binaries entering a
#      named build context), which belong to the real-machine / pre-release
#      manual checklist (docs/manual/multinode-test.md); pulling third-party
#      binaries inside a runner is not reproducible;
#   3. In-image builds go through the flock-protocol git dependency (the same
#      GitHub network as the host, no extra surface).
# The container face is guarded by local gates + the pre-release manual e2e
# (CONTRIBUTING's "container e2e guidance").
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu = the lint tier (clippy/fmt run once only, see the lint job);
        # windows/macos only test.
        # macos-14 has been retired by GitHub (jobs hung, cancelled, and dragged
        # whole runs down; the protocol repo measured macos-15 fully green) ——
        # macos-15 is likewise arm64, no cfg-face difference from 14.
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins 1.98.1; the same version is set explicitly here
      # (double insurance against runner preinstall drift).
      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: test (workspace, all features)
        run: cargo test --workspace --all-features

      - name: check headless client (no default features)
        run: cargo check -p flock-client --no-default-features

  lint:
    name: clippy + fmt (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy, rustfmt
      # rust-toolchain.toml pins profile = "minimal": any rustup auto-install
      # triggered through it lacks clippy/rustfmt ("cargo-clippy is not
      # installed") —— the action's components parameter above races with that
      # auto-install (the protocol repo hit the same trap at
      # flock-protocol@d2e1b89), so this step explicitly installs the
      # components after toolchain resolution, a deterministic fallback.
      - name: ensure clippy/rustfmt components
        run: rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: clippy (deny warnings)
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: fmt (check)
        run: cargo fmt --all -- --check
