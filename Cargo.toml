[workspace]
resolver = "2"
members = ["crates/flock-protocol", "crates/flock-frpc", "crates/flock-sync", "app/flock-server", "app/flock-client"]

# 布局与成员规划见 docs/design.md §1.1。

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
repository = "https://example.invalid/flock/flock-vpn"

[workspace.dependencies]
# 依赖代际统一按 docs/design.md §1.3.2（P1-6）：
# aes-gcm 0.11.1 / ed25519-dalek 3.0.0 / rand 0.9 新代际；ml-kem 0.3.3 + x25519-dalek 3.0.0（§1.3.3a）。
aes-gcm = "0.11.1"
ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ml-kem = "0.3.3"
sha2 = "0.11.1"
# opaque-ke 4.0.1 走 digest 0.10 代际（TripleDh 的 H）；与 sha2 0.11 并存（改名隔离）
sha2_compat = { package = "sha2", version = "0.10" }
hkdf = "0.13.0"
rand = "0.9"
rand_core = "0.10"
base64 = "0.22"
hex = "0.4"
rsa = "0.9.10"
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
zstd = "0.14.3"
lz4_flex = "0.14"
# session/mux 批次（§1.3.3c/§1.3.3d）：yamux 0.14.1（rust-yamux，libp2p 生态，vpn-mesh §4.1）
# + AEAD 后备档 XChaCha20-Poly1305 / AES-256-GCM-SIV（P1-8，与 aes-gcm 0.11.1 同 aead 0.6 代际）
# + tokio（异步 IO：TcpStream 接缝/时钟注入）+ futures（BoxFuture）。
yamux = "0.14.1"
chacha20poly1305 = "0.11.0"
aes-gcm-siv = "0.12.1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
futures = "0.3"
# flock-frpc（§3.9/M2）：原版 frpc TOML 只读解析 + admin basic auth 编码。
toml = "0.9"
# flock-server（§3.11/M2）：控制流消息（yamux stream0）postcard 编码 + server.toml 反序列化。
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
# 单服 NetState 适配器（§3.11/M2：redb 单机版，接口与 M4 flock-sync 对齐，§3.10）。
redb = "3"
# flock-client（§2.3/§3.12/M3）：tun 适配（tun-rs——vpn-mesh §1.2 选型；设计文档写
# 「2.8.16」，crates.io 当前 max_stable=2.8.14（2026-10-26 发布），以实际存在的版本钉）。
tun-rs = { version = "2.8.14", default-features = false }
# Linux 路由/地址配置（§2.3：/16 池指向 TUN + rp_filter=1；vpn-mesh §1.2/S10）。
rtnetlink = "0.23.0"

# 性能归因参考 showroom workspace 的 [profile.test] opt-level=1（docs/research/showroom-analysis §3：
# 8MiB aes-gcm 在 -O0 0.61s vs -O1 0.013s，46×）。
[profile.test]
opt-level = 1

# bench（§7-M1 aead 门槛）：跨 crate 内联（aes 的 AES-NI 轮函数 ↔ gcm 的 GHASH CLMUL 路径）
# 对吞吐敏感——LTO thin + 单 codegen unit 收回默认 release 配置下的损失。
[profile.bench]
lto = true
codegen-units = 1
