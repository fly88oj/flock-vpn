[workspace]
resolver = "2"
members = ["crates/flock-frpc", "crates/flock-sync", "app/flock-server", "app/flock-client"]

# Layout and member planning: docs/design.md §1.1.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"
# flock-protocol lives in its own repository (github.com/fly88oj/flock-protocol,
# tag v0.1.0) and is consumed via a git dependency (see the member manifests);
# for joint protocol development against a local checkout use [patch] — see CONTRIBUTING.md.
repository = "https://github.com/fly88oj/flock-vpn"

[workspace.dependencies]
# Dependency generations per docs/design.md §1.3.2 (P1-6):
# aes-gcm 0.11.1 / ed25519-dalek 3.0.0 / rand 0.9 new generation; ml-kem 0.3.3 + x25519-dalek 3.0.0 (§1.3.3a).
aes-gcm = "0.11.1"
ed25519-dalek = "3.0.0"
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }
ml-kem = "0.3.3"
sha2 = "0.11.1"
# opaque-ke 4.0.1 sits on the digest 0.10 generation (TripleDh's H); coexists
# with sha2 0.11 under a renamed alias for isolation.
sha2_compat = { package = "sha2", version = "0.10" }
hkdf = "0.13.0"
rand = "0.9"
rand_core = "0.10"
base64 = "0.22"
hex = "0.4"
rsa = "0.9.10"
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255"] }
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
zstd = "0.14.3"
lz4_flex = "0.14"
# session/mux batch (§1.3.3c/§1.3.3d): yamux 0.14.1 (rust-yamux, libp2p ecosystem, vpn-mesh §4.1)
# + AEAD fallback tier XChaCha20-Poly1305 / AES-256-GCM-SIV (P1-8, same aead 0.6 generation as aes-gcm 0.11.1)
# + tokio (async IO: TcpStream seam / clock injection) + futures (BoxFuture).
yamux = "0.14.1"
chacha20poly1305 = "0.11.0"
aes-gcm-siv = "0.12.1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
futures = "0.3"
# flock-frpc (§3.9/M2): read-only original-frpc TOML parsing + admin basic-auth encoding.
toml = "0.9"
# flock-server (§3.11/M2): control-plane messages (yamux stream 0) postcard encoding + server.toml deserialization.
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
# M8 webui (§7-M8.8): API JSON envelope + frontend asset embedding
# (include_dir is a proc-macro-level tiny crate; chosen over rust-embed by design:
# zero runtime dependencies, deterministic behavior).
serde_json = "1"
include_dir = "0.7"
# Single-server NetState adapter (§3.11/M2: redb single-node store, interface
# aligned with the M4 flock-sync state machine, §3.10).
redb = "3"
# flock-client (§2.3/§3.12/M3): tun adapter (tun-rs — vpn-mesh §1.2 selection;
# the design doc says "2.8.16" but the crates.io max_stable is 2.8.14
# (published 2026-10-26) — pin the version that actually exists).
tun-rs = { version = "2.8.14", default-features = false }
# Linux routing/address configuration (§2.3: /16 pool pointing at the TUN +
# rp_filter=1; vpn-mesh §1.2/S10).
rtnetlink = "0.23.0"

# Performance: see the showroom workspace's [profile.test] opt-level=1 rationale
# (docs/research/showroom-analysis §3: 8MiB aes-gcm at -O0 0.61s vs -O1 0.013s, 46×).
[profile.test]
opt-level = 1

# Bench (§7-M1 aead gate): cross-crate inlining (the AES-NI round functions in
# aes ↔ the GHASH CLMUL path in gcm) is throughput-sensitive — thin LTO + a
# single codegen unit recovers the loss of the default release configuration.
[profile.bench]
lto = true
codegen-units = 1
