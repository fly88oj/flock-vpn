[package]
name = "flock-frpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Dual-stack subprocess supervision of frpc: config generation / process supervision / health probing for the pinned ChmlFrp-0.51.2 and original frp v0.71.1 binaries (docs/design.md §3.9/§5, VPN-16)"

[dependencies]
# Supervision loop (process spawn/wait/kill + backoff timers + probe timeouts):
# the tokio process feature layers on top of the workspace tokio
# (net/io-util/time/sync/rt/macros).
tokio = { workspace = true, features = ["process"] }
# Read-only parsing of the original TOML config (probe-target derivation:
# webServer/[[proxies]]) — reads the caller-provided frpc.toml as-is, never
# rewrites it (§3.9 seam: the config file is the caller's asset).
toml = { workspace = true }
# frpc admin basic auth header (/api/status probing).
base64 = { workspace = true }

[dev-dependencies]
# Multi-threaded runtime for the integration tests (concurrent waiting on the
# crash/serve stubs).
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# No features: this crate is the full M2 surface (the feature split of §1.3.1
# belongs to flock-protocol; flock-frpc's two stack variants are
# distinguished at runtime via RelaySpec, no compile-time profiles).
