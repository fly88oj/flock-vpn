[package]
name = "chml-frpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "frpc 子进程双栈托管：ChmlFrp-0.51.2 与原版 frp v0.71.1 定版二进制的配置生成/进程守护/健康探测（docs/design.md §3.9/§5，VPN-16）"

[dependencies]
# 托管循环（进程 spawn/wait/kill + 退避定时 + 探测超时）：tokio process 档在 workspace
# tokio（net/io-util/time/sync/rt/macros）之上叠加。
tokio = { workspace = true, features = ["process"] }
# 原版 TOML 配置的只读解析（探活目标推导：webServer/[[proxies]]）——原样读取调用方
# 提供的 frpc.toml，绝不改写（§3.9 接缝：配置文件是调用方的资产）。
toml = { workspace = true }
# frpc admin basic auth 头（/api/status 探测）。
base64 = { workspace = true }

[dev-dependencies]
# 集成测试用多线程运行时（crash/serve 桩并发等待）。
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# 无 feature：本 crate 即 M2 全量面（§1.3.1 的 feature 划分属 chml-protocol；
# chml-frpc 两栈变体经 RelaySpec 运行时区分，不设编译期档）。
