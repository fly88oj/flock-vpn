[package]
name = "chml-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ChmlVPN / showroom 共享协议契约层：混合 KEM、文件信封 v2、SR-SIG1（docs/design.md §1）"

[dependencies]
aes-gcm = { workspace = true }
ed25519-dalek = { workspace = true }
x25519-dalek = { workspace = true }
ml-kem = { workspace = true }
sha2 = { workspace = true }
sha2_compat = { workspace = true }
hkdf = { workspace = true }
rand = { workspace = true }
# ml-kem 0.3.3 走 rand_core 0.10 代际（与 rand 0.9 的 rand_core 0.9 不同代），
# 库内以私有桥接适配（src/kem.rs），对外 RNG 面统一为 rand 0.9。
rand_core = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
rsa = { workspace = true, optional = true }
opaque-ke = { workspace = true }
argon2 = { workspace = true }
zstd = { workspace = true }
lz4_flex = { workspace = true }
# session/mux 批次（§1.3.3c/§1.3.3d / §3.5/§3.6）
yamux = { workspace = true }
chacha20poly1305 = { workspace = true }
aes-gcm-siv = { workspace = true }
futures = { workspace = true}

# wasm32：tokio net 不支持该目标（tokio Cargo.toml 将 socket2 限定非 wasm）；
# session/mux 库代码只用 io-util/time/sync/rt/macros。原生构建仍走 workspace 全量（含 net）。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "time", "sync", "rt", "macros"] }
# getrandom custom 后端（.cargo/config.toml 的 rustflags cfg）：桥见 src/wasm_bridge.rs。
# 两代并存：0.3（rand 0.9 代际）走 extern 符号；0.2（rand_core 0.6 ← opaque-ke 路径）
# 走 register_custom_getrandom! 宏（showroom wasm_shim 同法），同一熵池供两代。
getrandom = "0.3"
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }

[dev-dependencies]
serde_json = "1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# bench（§7-M1）：criterion 0.8 + aes-gcm（与库锁定同版本，仅基准用途）
criterion = "0.8"
aes-gcm = { workspace = true }

[[bench]]
name = "aead"
harness = false

[features]
default = []
# —— feature 划分按 docs/design.md §1.3.1 ——
# 默认（无具名 feature）＝全 VPN 档：sig / kem（混合 KEM）/ envelope v2 / pake / compress /
# session / mux。trust 模块按后续里程碑批次加入默认档。
# 信封 v1（RSA-OAEP）只读兼容：showroom 过渡用，默认关。
# rsa/sha2：Oaep::new::<Sha256> 需与 rsa 同代的 sha2 0.10 摘要类型（rsa::sha2 再导出）。
legacy = ["dep:rsa", "rsa/sha2"]
# OPAQUE 服务端身份签名层（P0-5 登录锚）：ChmlVPN 构建里开，默认关（本批次仅占位）。
anchor = []
# ML-DSA-65 并行公钥档（P2-12）：ml-dsa 0.1.1 未审计（crypto-2026 §5），默认关（本批次仅占位）。
pq-sign = []
# showroom wasm 约束（getrandom custom 后端桥 src/wasm_bridge.rs，showroom-analysis §6.3）：默认关。
wasm = []
