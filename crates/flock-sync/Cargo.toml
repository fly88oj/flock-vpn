[package]
name = "flock-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Flock VPN multi-primary multi-active synchronization: openraft replicated state machine + redb storage + server-server profile E2E transport (docs/design.md §3.10/§4, VPN-15)"

[dependencies]
# Standalone protocol repository (formerly crates/flock-protocol, independently
# published since v0.1.0): the whole VPN's default profile, no named features —
# identical to the dependency declaration before the extraction.
flock-protocol = { git = "https://github.com/fly88oj/flock-protocol.git", tag = "v0.1.0" }
openraft = { version = "0.9.25", features = ["serde", "storage-v2"] }
redb = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread"] }
# Integration tests enable test-util (in-memory fabric / RTT injection): a
# dev-dependency does not pollute the outward default profile.
flock-sync = { path = ".", features = ["test-util"] }

[features]
default = []
# In-memory interconnect fabric + RTT/failure injection (used by tests/cluster;
# not in the production default profile).
test-util = []
