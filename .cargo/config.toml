# wasm32-unknown-unknown: getrandom has no default backend on that target
# (the js feature needs wasm-bindgen, which the §8.3 showroom constraints
# forbid) — use the "custom" backend; the callback is provided in-crate by
# flock_protocol::wasm_bridge::__getrandom_v03_custom (the getrandom-0.3.4
# src/backends/custom.rs contract). Applies to that target only; native
# builds are unaffected.
[target.wasm32-unknown-unknown]
rustflags = ["--cfg", "getrandom_backend=\"custom\""]
